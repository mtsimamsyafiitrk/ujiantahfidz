async function submitKehadiranAdmin(pengujiId, tgl) {
  const status = document.querySelector('input[name="adminKehadiranStatus"]:checked')?.value;
  if (!status) return showToast('⚠️ Pilih status');
  const catatan = document.getElementById('adminKehadiranCatatan').value.trim();

  showLoading('Menyimpan...');
  try {
    const { data: existing } = await sb.from('kehadiran')
      .select('id').eq('penguji_id', pengujiId).eq('tanggal', tgl).maybeSingle();

    if (existing?.id) {
      const { error } = await sb.from('kehadiran')
        .update({ status, catatan, updated_at: new Date().toISOString() })
        .eq('id', existing.id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('kehadiran')
        .insert({ penguji_id: pengujiId, tanggal: tgl, status, catatan });
      if (error) throw error;
    }
    hideLoading();
    closeModal();
    showToast('✅ Tersimpan');
    renderAdminKehadiran();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

function hapusKehadiranAdmin(pengujiId, tgl) {
  showConfirm('Hapus Kehadiran', 'Hapus data kehadiran ini?', async () => {
    showLoading('Menghapus...');
    try {
      const { error } = await sb.from('kehadiran').delete()
        .eq('penguji_id', pengujiId).eq('tanggal', tgl);
      if (error) throw error;
      hideLoading();
      closeModal();
      showToast('🗑️ Dihapus');
      renderAdminKehadiran();
    } catch (e) {
      hideLoading();
      showToast('❌ ' + e.message);
    }
  }, '🗑️', 'Hapus', 'btn-danger');
}

// Export Kehadiran ke Excel
function exportKehadiranExcel() {
  const cache = window._kehadiranCache;
  if (!cache) return showToast('⚠️ Data belum siap');
  const { rekap } = cache;

  // Sheet 1: Rekap dengan kolom per tanggal
  const header = ['No', 'Nama Penguji', 'Username', 'Role'];
  KEHADIRAN_TANGGAL.forEach(tgl => {
    const d = new Date(tgl);
    header.push(d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }));
  });
  header.push('Total Poin', '% Kehadiran');

  const rows = [header];
  rekap.forEach((r, i) => {
    const row = [
      i + 1,
      r.penguji.nama,
      r.penguji.username,
      r.penguji.role
    ];
    KEHADIRAN_TANGGAL.forEach(tgl => {
      const k = r.peta[tgl];
      row.push(k ? STATUS_KEHADIRAN[k.status].label : '-');
    });
    const persen = Math.round((r.totalPoin / KEHADIRAN_TANGGAL.length) * 100);
    row.push(r.totalPoin, persen + '%');
    rows.push(row);
  });

  // Sheet 2: Detail per tanggal (untuk audit)
  const detailRows = [['Penguji', 'Tanggal', 'Status', 'Poin', 'Catatan']];
  rekap.forEach(r => {
    KEHADIRAN_TANGGAL.forEach(tgl => {
      const k = r.peta[tgl];
      if (k) {
        detailRows.push([
          r.penguji.nama,
          tgl,
          STATUS_KEHADIRAN[k.status].label,
          STATUS_KEHADIRAN[k.status].poin,
          k.catatan || ''
        ]);
      }
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(rows);
  ws1['!cols'] = [{wch:4},{wch:24},{wch:14},{wch:10},...KEHADIRAN_TANGGAL.map(()=>({wch:14})),{wch:11},{wch:11}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Rekap');
  const ws2 = XLSX.utils.aoa_to_sheet(detailRows);
  ws2['!cols'] = [{wch:24},{wch:12},{wch:18},{wch:6},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Detail');

  XLSX.writeFile(wb, `Rekap_Kehadiran_${todayLocal()}.xlsx`);
  showToast('✅ Excel tersimpan');
}

// Export Kehadiran ke PDF (A4)
async function exportKehadiranPDF() {
  if (typeof window.jspdf === 'undefined') {
    showToast('❌ Library PDF belum siap');
    return;
  }
  const cache = window._kehadiranCache;
  if (!cache) return showToast('⚠️ Data belum siap');
  const { rekap } = cache;

  showLoading('Membuat PDF...');
  try {
    const l = STATE.lembaga || {};
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageWidth = 210;
    const margin = 15;

    // Header
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(l.nama_lembaga || "MTs Al Imam Asy-Syafi'i", pageWidth / 2, 18, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(l.alamat || 'Tarakan, Kalimantan Utara', pageWidth / 2, 24, { align: 'center' });
    doc.text(`Tahun Ajaran ${l.tahun_ajaran || '-'}`, pageWidth / 2, 29, { align: 'center' });
    doc.setLineWidth(0.5);
    doc.line(margin, 33, pageWidth - margin, 33);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text('REKAP KEHADIRAN PENGUJI UJIAN TAHFIDZ', pageWidth / 2, 42, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    const today = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
    doc.text(`Periode: 27-30 April 2026`, margin, 50);
    doc.text(`Tanggal Cetak: ${today}`, margin, 55);

    // Tabel
    const head = [['No', 'Nama Penguji', ...KEHADIRAN_TANGGAL.map(t => {
      const d = new Date(t);
      return d.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
    }), 'Poin', '%']];

    const body = rekap.map((r, i) => {
      const row = [i + 1, r.penguji.nama];
      KEHADIRAN_TANGGAL.forEach(tgl => {
        const k = r.peta[tgl];
        row.push(k ? STATUS_KEHADIRAN[k.status].label.charAt(0) : '-');
      });
      const persen = Math.round((r.totalPoin / KEHADIRAN_TANGGAL.length) * 100);
      row.push(r.totalPoin, persen + '%');
      return row;
    });

    doc.autoTable({
      startY: 60,
      head: head,
      body: body,
      theme: 'grid',
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 2.5, lineColor: [180,180,180], lineWidth: 0.1 },
      headStyles: { fillColor: [37, 99, 235], textColor: [255,255,255], fontStyle: 'bold', halign: 'center' },
      columnStyles: {
        0: { cellWidth: 10, halign: 'center' },
        1: { cellWidth: 60 },
        ...Object.fromEntries(KEHADIRAN_TANGGAL.map((_,idx) => [idx + 2, { cellWidth: 18, halign: 'center', fontStyle: 'bold' }])),
        [KEHADIRAN_TANGGAL.length + 2]: { cellWidth: 14, halign: 'center', fontStyle: 'bold' },
        [KEHADIRAN_TANGGAL.length + 3]: { cellWidth: 18, halign: 'center', fontStyle: 'bold' }
      },
      alternateRowStyles: { fillColor: [239, 246, 255] },
      didParseCell: function(data) {
        if (data.section !== 'body') return;
        const tglIdxStart = 2;
        const tglIdxEnd = KEHADIRAN_TANGGAL.length + 1;
        if (data.column.index >= tglIdxStart && data.column.index <= tglIdxEnd) {
          const v = data.cell.raw;
          if (v === 'H') { data.cell.styles.fillColor = [209,250,229]; data.cell.styles.textColor = [5,150,105]; }
          else if (v === 'I') { data.cell.styles.fillColor = [219,234,254]; data.cell.styles.textColor = [30,64,175]; }
          else if (v === 'S') { data.cell.styles.fillColor = [254,243,199]; data.cell.styles.textColor = [133,77,14]; }
          else if (v === 'T') { data.cell.styles.fillColor = [254,226,226]; data.cell.styles.textColor = [220,38,38]; }
        }
      },
      margin: { left: margin, right: margin },
      didDrawPage: function(data) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(120,120,120);
        doc.text(`Halaman ${data.pageNumber}`, pageWidth - margin, 290, { align: 'right' });
        doc.text(`Dicetak: ${today}`, margin, 290);
      }
    });

    // Keterangan
    const finalY = doc.lastAutoTable.finalY + 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(60, 60, 60);
    doc.text('Keterangan: H = Hadir (1 poin), I = Izin (0), S = Sakit (0), T = Tanpa Keterangan (0)', margin, finalY);

    doc.save(`Rekap_Kehadiran_${todayLocal()}.pdf`);
    hideLoading();
    showToast('✅ PDF tersimpan');
  } catch (err) {
    hideLoading();
    showToast('❌ ' + err.message);
  }
}

// Render progress per penguji (hanya untuk admin)
async function renderProgressPerPenguji() {
  const box = document.getElementById('progressPerPenguji');
  if (!box) return;
  try {
    // Ambil semua penguji + semua assignment
    const [pengujiRes, assignRes] = await Promise.all([
      sb.from('penguji').select('id, nama, username, role').order('nama'),
      sb.from('assignment').select('penguji_id, status, siswa:siswa_id(kelas)')
    ]);
    if (pengujiRes.error) throw pengujiRes.error;
    if (assignRes.error) throw assignRes.error;

    const allPenguji = pengujiRes.data || [];
    // Exclude archived classes from progress stats
    const allAssign = (assignRes.data || []).filter(a => !STATE.kelasArsip.includes(a.siswa?.kelas));

    // Filter: tampilkan hanya penguji yang punya assignment (biar tidak penuh)
    const perPenguji = allPenguji.map(p => {
      const assigns = allAssign.filter(a => a.penguji_id === p.id);
      const total = assigns.length;
      const selesai = assigns.filter(a => a.status === 'selesai').length;
      return {
        ...p,
        total,
        selesai,
        belum: total - selesai,
        persen: total ? Math.round((selesai / total) * 100) : 0
      };
    }).filter(p => p.total > 0).sort((a,b) => b.persen - a.persen);

    if (!perPenguji.length) {
      box.innerHTML = `
        <div class="card">
          <div class="card-title">
            <span class="material-symbols-outlined" style="font-size:15px">groups</span>
            Progress Per Penguji
          </div>
          <div class="empty-state" style="padding:20px 0">
            <p class="text-small">Belum ada penguji yang mendapat tugas.</p>
          </div>
        </div>
      `;
      return;
    }

    box.innerHTML = `
      <div class="card">
        <div class="card-title">
          <span class="material-symbols-outlined" style="font-size:15px">groups</span>
          Progress Per Penguji (${perPenguji.length})
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${perPenguji.map(p => {
            // Warna berdasar persen
            const warna = p.persen >= 100 ? '#059669'
                        : p.persen >= 75 ? '#2563eb'
                        : p.persen >= 50 ? '#d97706'
                        : '#dc2626';
            return `
              <div style="background:var(--bg-input);padding:12px;border-radius:12px;border:1px solid var(--border)">
                <div class="flex-row flex-between" style="margin-bottom:6px">
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                      ${escapeHtml(p.nama)}
                    </div>
                    <div class="text-small text-muted" style="font-size:11px;margin-top:2px">
                      ${p.selesai}/${p.total} siswa · ${p.belum} belum dinilai
                    </div>
                  </div>
                  <div style="flex:0 0 auto;text-align:right">
                    <div style="font-size:18px;font-weight:800;color:${warna};font-family:'Noto Serif',serif;line-height:1">${p.persen}%</div>
                    ${p.persen >= 100 ? '<span class="badge badge-green" style="font-size:9px;margin-top:2px">✓ Selesai</span>' : ''}
                  </div>
                </div>
                <div class="progress-bar" style="background:rgba(255,255,255,0.6)">
                  <div class="progress-fill" style="width:${p.persen}%;background:${warna}"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    box.innerHTML = `
      <div class="alert alert-danger">
        <span class="material-symbols-outlined" style="font-size:15px">error</span>
        <span>Gagal memuat progress penguji: ${escapeHtml(e.message)}</span>
      </div>`;
  }
}

// ═════════════════════════════════════════════════════════════════
// HALAMAN PENGUJI: DAFTAR SANTRI (halaman pertama setelah login)
// ═════════════════════════════════════════════════════════════════
const DAFTAR = { tab: 'belum', q: '', data: [] };

function ketSantri(s) {
  if (!s || !s.status_dikunci) return 'Keterangan belum diisi';
  if (getKategori(s) === 'TAHAP_IQRA') return "Iqra'";
  return `Al-Qur'an · hafalan ${fmtJuz(s.jumlah_hafalan)} juz`;
}

async function renderDaftarSantri() {
  const c = document.getElementById('main-content');
  c.innerHTML = `
    <div id="dsProgress"></div>
    <label class="v-search">
      <span class="material-symbols-outlined" aria-hidden="true">search</span>
      <input type="text" id="dsCari" placeholder="Cari nama santri" aria-label="Cari nama santri"
             value="${escapeHtml(DAFTAR.q)}" oninput="DAFTAR.q = this.value; renderDaftarSantriList()">
    </label>
    <div class="v-seg" id="dsTabs"></div>
    <div id="dsList"><div class="text-center" style="padding:30px"><div class="spinner"></div></div></div>
  `;
  try {
    const data = await fetchAssignmentForPenguji(STATE.user.id);
    DAFTAR.data = data
      .filter(a => a.siswa && !STATE.kelasArsip.includes(a.siswa.kelas))
      .sort((a, b) => (a.siswa.kelas || '').localeCompare(b.siswa.kelas || '') || (a.siswa.nama || '').localeCompare(b.siswa.nama || ''));
    renderDaftarSantriList();
  } catch (e) {
    document.getElementById('dsList').innerHTML =
      `<div class="alert alert-danger"><span>Gagal memuat daftar santri: ${escapeHtml(e.message)}</span></div>`;
  }
}

function renderDaftarSantriList() {
  const all = DAFTAR.data;
  const selesai = all.filter(a => a.status === 'selesai').length;
  const belum = all.length - selesai;
  const persen = all.length ? Math.round(selesai / all.length * 100) : 0;

  const prog = document.getElementById('dsProgress');
  if (!prog) return;
  prog.innerHTML = all.length ? `
    <div class="v-progress">
      <div class="v-progress-row"><span>${selesai} dari ${all.length} santri selesai</span><span class="muted">${belum} lagi</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${persen}%"></div></div>
    </div>` : '';

  document.getElementById('dsTabs').innerHTML = `
    <button class="${DAFTAR.tab === 'belum' ? 'on' : ''}" onclick="DAFTAR.tab='belum'; renderDaftarSantriList()">Belum dinilai · ${belum}</button>
    <button class="${DAFTAR.tab === 'selesai' ? 'on' : ''}" onclick="DAFTAR.tab='selesai'; renderDaftarSantriList()">Selesai · ${selesai}</button>
  `;

  const needle = DAFTAR.q.toLowerCase().trim();
  const rows = all.filter(a =>
    (DAFTAR.tab === 'selesai') === (a.status === 'selesai') &&
    (!needle || (a.siswa.nama || '').toLowerCase().includes(needle) || (a.siswa.kelas || '').toLowerCase().includes(needle))
  );

  let html;
  if (!all.length) {
    html = '<div class="v-empty">Belum ada santri yang ditugaskan kepada Anda. Silakan hubungi admin.</div>';
  } else if (!rows.length) {
    html = `<div class="v-empty">${needle ? 'Tidak ada santri yang cocok.' : (DAFTAR.tab === 'belum' ? 'Semua santri sudah dinilai.' : 'Belum ada santri yang selesai dinilai.')}</div>`;
  } else {
    html = rows.map(a => `
      <button class="v-row" onclick="bukaSantri('${a.siswa_id}', '${a.penguji_id}', 'home')">
        <span class="v-kelas">${escapeHtml(a.siswa.kelas || '-')}</span>
        <span class="v-row-info">
          <span class="v-row-nama">${escapeHtml(a.siswa.nama || '-')}</span>
          <span class="v-row-ket">${escapeHtml(ketSantri(a.siswa))}</span>
        </span>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>`).join('');
  }
  document.getElementById('dsList').innerHTML = html;
}

// Buka santri: kalau statusnya belum dikunci → layar Keterangan dulu, kalau sudah → langsung isi nilai
async function bukaSantri(siswaId, pengujiId, asal) {
  showLoading('Memuat...');
  try {
    const { data: siswa, error } = await sb.from('siswa').select('*').eq('id', siswaId).single();
    if (error) throw error;
    hideLoading();
    if (!siswa.status_dikunci) {
      KET_STATE = { siswa, pengujiId, asal: asal || 'home', juz: Number(siswa.jumlah_hafalan) || 0 };
      renderKeterangan();
    } else {
      openFormPenilaian(siswaId, pengujiId, asal);
    }
  } catch (e) {
    hideLoading();
    showToast('❌ Gagal: ' + pesanError(e));
  }
}

// ═════════════════════════════════════════════════════════════════
// KETERANGAN SANTRI: status (Iqra' / Al-Qur'an) + jumlah hafalan
// Status dikunci lewat konfirmasi supaya tidak terganti tanpa sengaja.
// ═════════════════════════════════════════════════════════════════
let KET_STATE = null; // { siswa, pengujiId, asal, juz }

function renderKeterangan() {
  const { siswa } = KET_STATE;
  const terkunci = !!siswa.status_dikunci;
  const kat = getKategori(siswa);
  const iqra = terkunci && kat === 'TAHAP_IQRA';
  const quran = terkunci && kat !== 'TAHAP_IQRA';
  const cls = (aktif) => 'v-status' + (aktif ? ' on' : (terkunci ? ' off' : ''));

  document.body.classList.add('mode-form');
  document.getElementById('main-content').innerHTML = `
    <div class="v-formhead">
      <button class="v-back" aria-label="Kembali" onclick="showPage('${KET_STATE.asal}')">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div class="v-formhead-info">
        <div class="v-title">${escapeHtml(siswa.nama)}</div>
        <div class="v-sub">Kelas ${escapeHtml(siswa.kelas || '-')}</div>
      </div>
    </div>

    <div class="v-section">
      <div class="v-section-head">
        <span>Status santri</span>
        ${terkunci ? `<button class="v-link" onclick="bukaKunciStatus()">
          <span class="material-symbols-outlined" style="font-size:16px">lock</span> Terkunci · buka kunci</button>` : ''}
      </div>
      <div class="v-status-grid">
        <button class="${cls(iqra)}" aria-pressed="${iqra}" onclick="pilihStatus('TAHAP_IQRA')">
          <b>Iqra'</b><span>Belum Al-Qur'an</span>
        </button>
        <button class="${cls(quran)}" aria-pressed="${quran}" onclick="pilihStatus('ALQURAN_LANJUT')">
          <b>Al-Qur'an</b><span>Sudah membaca mushaf</span>
        </button>
      </div>
      ${terkunci ? '' : '<p class="v-hint">Pilih salah satu. Anda akan diminta mengunci pilihan supaya tidak terganti tanpa sengaja.</p>'}
    </div>

    ${quran ? `
      <div class="v-section">
        <div class="v-section-head"><span>Jumlah hafalan selama ini</span></div>
        <div class="v-stepper">
          <button aria-label="Kurangi" onclick="ubahJumlahHafalan(-0.5)">−</button>
          <div><b id="ketJuz">${fmtJuz(KET_STATE.juz)}</b><span>juz</span></div>
          <button aria-label="Tambah" onclick="ubahJumlahHafalan(0.5)">+</button>
        </div>
      </div>` : ''}

    ${terkunci ? `
      <div class="v-footer"><div class="v-footer-inner">
        <button class="btn btn-primary btn-full" onclick="mulaiMenilai()">Mulai menilai</button>
      </div></div>` : ''}
  `;
}

function ubahJumlahHafalan(delta) {
  KET_STATE.juz = Math.min(30, Math.max(0, KET_STATE.juz + delta));
  document.getElementById('ketJuz').textContent = fmtJuz(KET_STATE.juz);
}

function pilihStatus(kategori) {
  const { siswa, pengujiId } = KET_STATE;
  if (siswa.status_dikunci) return; // sudah terkunci — harus buka kunci dulu
  const label = getKategoriInfo(kategori).label;
  showConfirm(
    `Kunci status: ${label}?`,
    `${siswa.nama} (${siswa.kelas || '-'}) akan dinilai sebagai santri ${label}. Status dikunci supaya tidak terganti tanpa sengaja. Anda masih bisa membuka kuncinya bila keliru.`,
    async () => {
      showLoading('Menyimpan...');
      try {
        const berubah = getKategori(siswa) !== kategori;
        const { error } = await sb.from('siswa')
          .update({ kategori, status_dikunci: true }).eq('id', siswa.id);
        if (error) throw error;
        // Status berganti padahal sudah ada nilai → nilai lama harus disimpan ulang dengan cara hitung baru
        if (berubah) {
          const { data: pen } = await sb.from('penilaian').select('id').eq('siswa_id', siswa.id).eq('penguji_id', pengujiId).maybeSingle();
          if (pen) {
            const { error: eAs } = await sb.from('assignment').update({ status: 'belum' })
              .eq('siswa_id', siswa.id).eq('penguji_id', pengujiId);
            if (eAs) throw eAs;
            showToast('⚠️ Status berubah. Nilai lama perlu diperiksa dan disimpan ulang.', 5000);
          }
        }
        siswa.kategori = kategori;
        siswa.status_dikunci = true;
        hideLoading();
        renderKeterangan();
      } catch (e) {
        hideLoading();
        showToast('❌ ' + pesanError(e));
      }
    },
    '🔒', 'Ya, kunci', 'btn-primary'
  );
}

function bukaKunciStatus() {
  const { siswa } = KET_STATE;
  showConfirm(
    'Buka kunci status?',
    `Status ${siswa.nama} bisa dipilih ulang. Bila statusnya diganti, nilai yang sudah diisi perlu disimpan ulang.`,
    async () => {
      showLoading('Menyimpan...');
      try {
        const { error } = await sb.from('siswa').update({ status_dikunci: false }).eq('id', siswa.id);
        if (error) throw error;
        siswa.status_dikunci = false;
        hideLoading();
        renderKeterangan();
      } catch (e) {
        hideLoading();
        showToast('❌ ' + pesanError(e));
      }
    },
    '🔓', 'Ya, buka', 'btn-primary'
  );
}

async function mulaiMenilai() {
  const { siswa, pengujiId, asal, juz } = KET_STATE;
  if (getKategori(siswa) !== 'TAHAP_IQRA' && Number(siswa.jumlah_hafalan || 0) !== juz) {
    showLoading('Menyimpan...');
    const { error } = await sb.from('siswa').update({ jumlah_hafalan: juz }).eq('id', siswa.id);
    hideLoading();
    if (error) return showToast('❌ ' + pesanError(error));
  }
  openFormPenilaian(siswa.id, pengujiId, asal);
}

// ═════════════════════════════════════════════════════════════════
// FORM PENILAIAN
// - Al-Qur'an : cari surah → kartu nilai per surah
// - Iqra'     : nilai membaca (3 aspek); nilai hafalan hanya bila diaktifkan penguji
// ═════════════════════════════════════════════════════════════════
let FORM_STATE = null;
const ASPEK = [
  ['kelancaran', 'Lancar'], ['tajwid', 'Tajwid'], ['kekuatan_hafalan', 'Hafalan'], ['adab_tartil', 'Adab']
];
const ASPEK_BACA = [['lancar', 'Lancar'], ['tajwid', 'Tajwid'], ['adab', 'Adab']];

async function openFormPenilaian(siswaId, pengujiId, asal) {
  showLoading('Memuat data santri...');
  try {
    const [siswaRes, pengujiRes, surahRes] = await Promise.all([
      sb.from('siswa').select('*').eq('id', siswaId).single(),
      sb.from('penguji').select('id, nama, username').eq('id', pengujiId).single(),
      sb.from('surah').select('*').eq('aktif', true).order('nomor')
    ]);
    if (siswaRes.error) throw siswaRes.error;
    if (pengujiRes.error) throw pengujiRes.error;
    if (surahRes.error) throw surahRes.error;
    const siswa = siswaRes.data;
    STATE.cache.surah = surahRes.data || [];

    const existing = await fetchPenilaianBySiswaPenguji(siswaId, pengujiId);
    const baris = (existing?.nilai_detail || []).map(n => ({
      surah_nama: n.surah_nama,
      kelancaran: n.kelancaran, tajwid: n.tajwid,
      kekuatan_hafalan: n.kekuatan_hafalan, adab_tartil: n.adab_tartil
    })).sort((a, b) => nomorSurah(a.surah_nama) - nomorSurah(b.surah_nama));

    const iqra = getKategori(siswa) === 'TAHAP_IQRA';
    const hafalanAktif = iqra ? !!existing?.hafalan_aktif : true;

    // Admin: kalau jumlah juz tersimpan berbeda dari hitungan otomatis, anggap dulu di-override manual
    let override = false;
    if (existing?.jumlah_juz != null && STATE.user.role === 'admin' && hafalanAktif && baris.length) {
      const auto = hitungJuzOtomatis(baris.filter(barisLengkap)).totalJuz;
      override = Math.abs(Number(existing.jumlah_juz) - auto) > 0.05;
    }

    FORM_STATE = {
      siswa, penguji: pengujiRes.data, asal: asal || 'home',
      penilaianId: existing?.id || null,
      tanggal: existing?.tanggal_ujian || todayLocal(),
      catatan: existing?.catatan || '',
      baris, aktif: -1,
      baca: {
        lancar: existing?.baca_lancar ?? '',
        tajwid: existing?.baca_tajwid ?? '',
        adab: existing?.baca_adab ?? ''
      },
      hafalanAktif,
      juzManualOverride: override,
      jumlah_juz: override ? Number(existing.jumlah_juz) : ''
    };
    hideLoading();
    renderFormPenilaian();
  } catch (e) {
    hideLoading();
    showToast('❌ Gagal: ' + pesanError(e));
  }
}

function tutupForm() {
  showPage(FORM_STATE?.asal || 'home');
}

function bukaKeteranganDariForm() {
  const fs = FORM_STATE;
  KET_STATE = { siswa: fs.siswa, pengujiId: fs.penguji.id, asal: fs.asal, juz: Number(fs.siswa.jumlah_hafalan) || 0 };
  renderKeterangan();
}

function renderFormPenilaian() {
  const fs = FORM_STATE;
  const s = fs.siswa;
  const iqra = getKategori(s) === 'TAHAP_IQRA';
  const isAdmin = STATE.user.role === 'admin';

  document.body.classList.add('mode-form');
  document.getElementById('main-content').innerHTML = `
    <div class="v-formhead">
      <button class="v-back" aria-label="Kembali" onclick="tutupForm()">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div class="v-formhead-info">
        <div class="v-title">${escapeHtml(s.nama)}</div>
        <button class="v-sub v-sub-btn" onclick="bukaKeteranganDariForm()" title="Lihat keterangan santri">
          ${escapeHtml(s.kelas || '-')} · ${escapeHtml(iqra ? "Iqra'" : `Al-Qur'an · hafalan ${fmtJuz(s.jumlah_hafalan)} juz`)}
          <span class="material-symbols-outlined" style="font-size:14px">lock</span>
        </button>
      </div>
    </div>

    ${iqra ? `
      <div class="v-card">
        <div class="v-card-head"><div class="v-card-nama">Nilai membaca</div><span class="v-total" id="totBaca"></span></div>
        <div class="v-grid3">
          ${ASPEK_BACA.map(([f, label]) => `
            <label>${label}
              <input type="number" inputmode="numeric" min="0" max="100" value="${fs.baca[f] ?? ''}"
                     oninput="isiBaca('${f}', this.value)">
            </label>`).join('')}
        </div>
      </div>
      <div class="v-card v-switch-row">
        <label for="swHafalan" class="v-card-nama" style="margin:0;cursor:pointer">Munculkan nilai hafalan</label>
        <input type="checkbox" id="swHafalan" class="v-switch" role="switch" ${fs.hafalanAktif ? 'checked' : ''}
               onchange="toggleHafalan(this.checked)">
      </div>` : ''}

    <div id="blokSurah" style="${fs.hafalanAktif ? '' : 'display:none'}">
      <label class="v-search v-search-strong">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <input type="text" id="cariSurah" placeholder="Cari surah: nama atau nomor" aria-label="Cari surah"
               autocomplete="off" oninput="renderHasilCari(this.value)">
      </label>
      <div id="hasilCari"></div>
      <div id="surahCards"></div>
      ${isAdmin ? `
        <div class="v-admin-override">
          <label style="display:flex;align-items:center;gap:8px;margin:0">
            <input type="checkbox" id="fJuzManual" ${fs.juzManualOverride ? 'checked' : ''}
                   onchange="toggleJuzManual(this.checked)" style="width:16px;height:16px">
            <span>Atur jumlah juz tersetor secara manual (admin)</span>
          </label>
          <input type="number" id="fJuz" min="0" max="30" step="0.25" value="${fs.jumlah_juz}"
                 placeholder="Contoh: 2 atau 2.5" oninput="isiJuzManual(this.value)"
                 style="margin-top:8px;${fs.juzManualOverride ? '' : 'display:none'}">
        </div>` : ''}
    </div>

    <div id="catatanWrap" style="${fs.catatan ? '' : 'display:none'};margin-top:12px">
      <textarea id="fCatatan" placeholder="Catatan penguji (opsional)" style="min-height:70px">${escapeHtml(fs.catatan)}</textarea>
    </div>

    ${fs.penilaianId ? `
      <button class="v-link v-link-danger" style="margin:16px auto 0" onclick="hapusPenilaian()">Hapus penilaian ini</button>` : ''}

    <div class="v-footer"><div class="v-footer-inner">
      <div class="v-footer-row">
        <div class="v-footer-meta">
          <input type="date" id="fTanggal" class="v-date" aria-label="Tanggal ujian" value="${fs.tanggal}">
          <button class="v-link" onclick="toggleCatatan()">Catatan</button>
        </div>
        <div class="v-akhir"><span>NILAI AKHIR</span><b id="nilaiAkhirTeks">—</b></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="simpanPenilaian()">Simpan penilaian</button>
    </div></div>
  `;
  renderSurahCards();
  updateFooter();
}

function toggleCatatan() {
  const w = document.getElementById('catatanWrap');
  const tampil = w.style.display === 'none';
  w.style.display = tampil ? '' : 'none';
  if (tampil) document.getElementById('fCatatan').focus();
}

// ── Pencarian surah: hanya menampilkan surah yang belum dipilih ──
function renderHasilCari(q) {
  const box = document.getElementById('hasilCari');
  const raw = String(q || '').trim().toLowerCase();
  if (!raw) { box.innerHTML = ''; return; }
  const norm = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, '');
  const kata = norm(raw);
  const angka = /^\d+$/.test(raw);
  const dipilih = new Set(FORM_STATE.baris.map(b => b.surah_nama));
  const cocok = (STATE.cache.surah || [])
    .filter(s => !dipilih.has(s.nama))
    .filter(s => angka ? String(s.nomor).startsWith(raw) : norm(s.nama).includes(kata))
    .sort((a, b) => angka ? (String(a.nomor).length - String(b.nomor).length || a.nomor - b.nomor) : a.nomor - b.nomor)
    .slice(0, 6);
  box.innerHTML = cocok.length
    ? `<div class="v-hasil">${cocok.map(s =>
        `<button onclick="pilihSurah(${s.nomor})">${s.nomor}. ${escapeHtml(s.nama)}</button>`).join('')}</div>`
    : '<p class="v-hint">Surah tidak ditemukan atau sudah dipilih.</p>';
}

function pilihSurah(nomor) {
  const s = (STATE.cache.surah || []).find(x => x.nomor === nomor);
  if (!s || FORM_STATE.baris.some(b => b.surah_nama === s.nama)) return;
  FORM_STATE.baris.push({ surah_nama: s.nama, kelancaran: '', tajwid: '', kekuatan_hafalan: '', adab_tartil: '' });
  // Selalu tersusun menurut urutan surah, jadi tidak ada sela walau penguji melompat
  FORM_STATE.baris.sort((a, b) => nomorSurah(a.surah_nama) - nomorSurah(b.surah_nama));
  FORM_STATE.aktif = FORM_STATE.baris.findIndex(b => b.surah_nama === s.nama);
  const cari = document.getElementById('cariSurah');
  cari.value = '';
  document.getElementById('hasilCari').innerHTML = '';
  renderSurahCards();
  const input = document.querySelector(`#surahCards .v-card[data-i="${FORM_STATE.aktif}"] input`);
  if (input) input.focus();
}

function renderSurahCards() {
  const fs = FORM_STATE;
  const box = document.getElementById('surahCards');
  if (!box) return;
  if (!fs.baris.length) {
    box.innerHTML = '<div class="v-empty">Belum ada surah. Cari surah di atas untuk mulai menilai.</div>';
    return;
  }
  box.innerHTML = fs.baris.map((b, i) => `
    <div class="v-card${i === fs.aktif ? ' aktif' : ''}" data-i="${i}" onclick="aktifkanSurah(${i})">
      <div class="v-card-head">
        <div class="v-card-nama">${nomorSurah(b.surah_nama)}. ${escapeHtml(b.surah_nama)}<span class="v-juz" id="juz-${i}"></span></div>
        <div class="v-card-right">
          <span class="v-total" id="tot-${i}"></span>
          <button class="v-x" aria-label="Hapus surah ${escapeHtml(b.surah_nama)}" onclick="event.stopPropagation(); hapusSurah(${i})">
            <span class="material-symbols-outlined" style="font-size:18px">close</span>
          </button>
        </div>
      </div>
      <div class="v-grid4">
        ${ASPEK.map(([f, label]) => `
          <label>${label}
            <input type="number" inputmode="numeric" min="0" max="100" value="${b[f] ?? ''}"
                   onfocus="aktifkanSurah(${i})" oninput="isiNilai(${i}, '${f}', this.value)">
          </label>`).join('')}
      </div>
      <button class="v-salin" id="salin-${i}" style="display:none" onclick="event.stopPropagation(); salinSebelumnya(${i})"></button>
    </div>`).join('');
  fs.baris.forEach((_, i) => refreshKartu(i));
}

// Surah lengkap terdekat sebelum baris i (untuk tombol "Salin nilai surah sebelumnya")
function barisSebelumnya(i) {
  for (let j = i - 1; j >= 0; j--) if (barisLengkap(FORM_STATE.baris[j])) return FORM_STATE.baris[j];
  return null;
}

function refreshKartu(i) {
  const b = FORM_STATE.baris[i];
  const lengkap = barisLengkap(b);
  const tot = document.getElementById('tot-' + i);
  const juz = document.getElementById('juz-' + i);
  const salin = document.getElementById('salin-' + i);
  if (!tot) return;
  tot.textContent = lengkap ? hitungTotal(b).toFixed(2) : '';
  // Tanda juz hanya untuk surah yang sudah dinilai
  juz.textContent = lengkap ? labelJuzSurah(b.surah_nama) : '';
  juz.style.display = lengkap && juz.textContent ? '' : 'none';
  const prev = barisSebelumnya(i);
  const bisa = i === FORM_STATE.aktif && barisKosong(b) && !!prev;
  salin.style.display = bisa ? '' : 'none';
  if (bisa) salin.textContent = `Salin nilai surah sebelumnya (${ASPEK.map(([f]) => prev[f]).join(' · ')})`;
}

function aktifkanSurah(i) {
  if (FORM_STATE.aktif === i) return;
  FORM_STATE.aktif = i;
  document.querySelectorAll('#surahCards .v-card').forEach(el =>
    el.classList.toggle('aktif', Number(el.dataset.i) === i));
  FORM_STATE.baris.forEach((_, j) => refreshKartu(j));
}

function isiNilai(i, field, val) {
  FORM_STATE.baris[i][field] = val === '' ? '' : Number(val);
  refreshKartu(i);
  updateFooter();
}

function salinSebelumnya(i) {
  const prev = barisSebelumnya(i);
  if (!prev) return;
  ASPEK.forEach(([f]) => { FORM_STATE.baris[i][f] = prev[f]; });
  renderSurahCards();
  updateFooter();
}

function hapusSurah(i) {
  const b = FORM_STATE.baris[i];
  const buang = () => {
    FORM_STATE.baris.splice(i, 1);
    FORM_STATE.aktif = -1;
    renderSurahCards();
    updateFooter();
  };
  if (barisKosong(b)) return buang();
  showConfirm('Hapus surah', `Nilai surah ${b.surah_nama} akan dibuang dari penilaian ini. Lanjutkan?`, buang, '🗑️', 'Hapus', 'btn-danger');
}

function isiBaca(field, val) {
  FORM_STATE.baca[field] = val === '' ? '' : Number(val);
  updateFooter();
}

function toggleHafalan(aktif) {
  FORM_STATE.hafalanAktif = aktif;
  document.getElementById('blokSurah').style.display = aktif ? '' : 'none';
  updateFooter();
}

function toggleJuzManual(checked) {
  FORM_STATE.juzManualOverride = checked;
  document.getElementById('fJuz').style.display = checked ? '' : 'none';
  updateFooter();
}

function isiJuzManual(val) {
  FORM_STATE.jumlah_juz = val === '' ? '' : Number(val);
  updateFooter();
}

function hasilForm() {
  const fs = FORM_STATE;
  return hitungPenilaian({
    siswa: fs.siswa,
    baris: fs.baris,
    baca: fs.baca,
    hafalanAktif: fs.hafalanAktif,
    juzManual: fs.juzManualOverride ? fs.jumlah_juz : null
  });
}

function updateFooter() {
  const el = document.getElementById('nilaiAkhirTeks');
  if (!el) return;
  const fs = FORM_STATE;
  const iqra = getKategori(fs.siswa) === 'TAHAP_IQRA';
  const h = hasilForm();
  const adaData = iqra ? bacaLengkap(fs.baca) : fs.baris.some(barisLengkap);
  el.textContent = adaData ? h.akhir.toFixed(2) : '—';
  const totBaca = document.getElementById('totBaca');
  if (totBaca) totBaca.textContent = bacaLengkap(fs.baca) ? h.membaca.toFixed(2) : '';
}

async function simpanPenilaian() {
  const fs = FORM_STATE;
  const siswa = fs.siswa;
  const iqra = getKategori(siswa) === 'TAHAP_IQRA';
  const diluar = v => isNaN(Number(v)) || Number(v) < 0 || Number(v) > 100;

  // Nilai membaca (khusus Iqra')
  if (iqra) {
    if (!bacaLengkap(fs.baca)) return showToast('⚠️ Isi ketiga nilai membaca');
    if (ASPEK_BACA.some(([f]) => diluar(fs.baca[f]))) return showToast('⚠️ Nilai membaca harus 0–100');
  }

  // Nilai per surah. Surah yang dipilih tetapi kosong sama sekali tidak ikut disimpan.
  let valid = [];
  if (fs.hafalanAktif) {
    for (const b of fs.baris) {
      if (barisKosong(b)) continue;
      if (!barisLengkap(b)) return showToast(`⚠️ Lengkapi keempat nilai surah ${b.surah_nama}`);
      if (ASPEK.some(([f]) => diluar(b[f]))) return showToast(`⚠️ Nilai surah ${b.surah_nama} harus 0–100`);
      valid.push(b);
    }
    if (!valid.length) {
      return showToast(iqra
        ? '⚠️ Tambahkan minimal 1 surah, atau matikan nilai hafalan'
        : '⚠️ Nilai minimal 1 surah');
    }
    if (fs.juzManualOverride) {
      const j = fs.jumlah_juz;
      if (j === '' || isNaN(Number(j)) || Number(j) < 0 || Number(j) > 30) {
        return showToast('⚠️ Jumlah juz manual harus 0–30, atau matikan pengaturan manual');
      }
    }
  }

  const tanggal = document.getElementById('fTanggal').value;
  const catatan = document.getElementById('fCatatan').value.trim();
  if (!tanggal) return showToast('⚠️ Tanggal ujian wajib diisi');

  const h = hitungPenilaian({
    siswa, baris: valid, baca: fs.baca, hafalanAktif: fs.hafalanAktif,
    juzManual: fs.juzManualOverride ? fs.jumlah_juz : null
  });

  showLoading('Menyimpan...');
  try {
    let penilaianId = fs.penilaianId;
    const payload = {
      tanggal_ujian: tanggal,
      catatan,
      nilai_kualitas: h.kualitas,
      jumlah_juz: h.juz,
      nilai_kuantitas: h.kuantitas,
      nilai_akhir: h.akhir,
      baca_lancar: iqra ? Number(fs.baca.lancar) : null,
      baca_tajwid: iqra ? Number(fs.baca.tajwid) : null,
      baca_adab: iqra ? Number(fs.baca.adab) : null,
      hafalan_aktif: iqra ? !!fs.hafalanAktif : false,
      updated_at: new Date().toISOString()
    };

    if (penilaianId) {
      const { error: eUpd } = await sb.from('penilaian').update(payload).eq('id', penilaianId);
      if (eUpd) throw eUpd;
      const { error: eDel } = await sb.from('nilai_detail').delete().eq('penilaian_id', penilaianId);
      if (eDel) throw eDel;
    } else {
      const { data: newP, error: eIns } = await sb.from('penilaian')
        .insert({ siswa_id: siswa.id, penguji_id: fs.penguji.id, ...payload })
        .select().single();
      if (eIns) throw eIns;
      penilaianId = newP.id;
      // Catat id-nya sekarang: kalau langkah berikutnya gagal (mis. sinyal putus) lalu
      // penguji menekan Simpan lagi, yang terjadi update — bukan insert kedua (duplicate key).
      fs.penilaianId = penilaianId;
    }

    if (valid.length) {
      const detailRows = valid.map((b, idx) => ({
        penilaian_id: penilaianId,
        surah_nama: b.surah_nama,
        kelancaran: Number(b.kelancaran),
        tajwid: Number(b.tajwid),
        kekuatan_hafalan: Number(b.kekuatan_hafalan),
        adab_tartil: Number(b.adab_tartil),
        urutan: idx
      }));
      const { error: eDet } = await sb.from('nilai_detail').insert(detailRows);
      if (eDet) throw eDet;
    }

    const { error: eAs } = await sb.from('assignment')
      .update({ status: 'selesai' })
      .eq('siswa_id', siswa.id).eq('penguji_id', fs.penguji.id);
    if (eAs) throw eAs;

    hideLoading();
    showToast(`✅ Tersimpan · Nilai akhir ${h.akhir.toFixed(2)}`);
    tutupForm();
  } catch (e) {
    hideLoading();
    showToast('❌ Gagal simpan: ' + pesanError(e), 5000);
  }
}

async function hapusPenilaian() {
  if (!FORM_STATE.penilaianId) return;
  showConfirm(
    'Hapus Penilaian',
    'Nilai ujian untuk siswa ini akan dihapus permanen. Lanjutkan?',
    async () => {
      showLoading('Menghapus...');
      try {
        // Hapus detail dulu (ON DELETE CASCADE sebenarnya sudah handle, tapi eksplisit)
        const { error: e1 } = await sb.from('nilai_detail').delete().eq('penilaian_id', FORM_STATE.penilaianId);
        if (e1) throw e1;
        const { error: e2 } = await sb.from('penilaian').delete().eq('id', FORM_STATE.penilaianId);
        if (e2) throw e2;

        // Kembalikan status assignment ke 'belum'
        const { error: e3 } = await sb.from('assignment')
          .update({ status: 'belum' })
          .eq('siswa_id', FORM_STATE.siswa.id)
          .eq('penguji_id', FORM_STATE.penguji.id);
        if (e3) throw e3;

        hideLoading();
        showToast('🗑️ Penilaian dihapus');
        tutupForm();
      } catch (e) {
        hideLoading();
        showToast('❌ Gagal hapus: ' + e.message);
      }
    },
    '🗑️', 'Hapus', 'btn-danger'
  );
}

async function renderRekap() {
  const c = document.getElementById('main-content');
  c.innerHTML = `
    <div class="page-header">
      <h2>Rekap Nilai</h2>
      <p>Ringkasan hasil penilaian tahfidz</p>
    </div>
    <div id="rekapBody"><div class="card"><div class="text-center" style="padding:30px"><div class="spinner"></div></div></div></div>
  `;

  try {
    const isAdmin = STATE.user.role === 'admin';
    const isKetuaTahfidz = STATE.user.role === 'ketua_tahfidz';
    const canSeeAll = isAdmin || isKetuaTahfidz;
    let allData = await fetchAllPenilaianLengkap();
    // Penguji biasa hanya lihat rekapnya sendiri
    if (!canSeeAll) {
      allData = allData.filter(p => p.penguji?.id === STATE.user.id);
    }
    const data = allData;
    if (!data.length) {
      document.getElementById('rekapBody').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <p>Belum ada penilaian yang tersimpan.</p>
        </div>`;
      return;
    }

    // Kelompokkan kelas untuk filter (exclude arsip)
    const kelasSet = [...new Set(data.map(p => p.siswa?.kelas).filter(k => k && !STATE.kelasArsip.includes(k)))].sort();
    const pengujiSet = canSeeAll ? [...new Set(data.map(p => p.penguji?.nama).filter(Boolean))].sort() : [];

    if (!STATE.filter.kategori) STATE.filter.kategori = 'all';

    let filtered = data.filter(p => {
      if (STATE.kelasArsip.includes(p.siswa?.kelas)) return false;
      if (STATE.filter.kelas !== 'all' && p.siswa?.kelas !== STATE.filter.kelas) return false;
      if (canSeeAll && STATE.filter.penguji !== 'all' && p.penguji?.nama !== STATE.filter.penguji) return false;
      if (STATE.filter.kategori !== 'all' && getKategori(p.siswa) !== STATE.filter.kategori) return false;
      return true;
    });

    // Statistik
    const nilaiAkhir = filtered.map(p => Number(p.nilai_akhir) || 0);
    const rata = nilaiAkhir.length ? nilaiAkhir.reduce((a,b)=>a+b,0) / nilaiAkhir.length : 0;
    const max = nilaiAkhir.length ? Math.max(...nilaiAkhir) : 0;
    const min = nilaiAkhir.length ? Math.min(...nilaiAkhir) : 0;

    document.getElementById('rekapBody').innerHTML = `
      <!-- Filter Kelas -->
      <div class="filter-bar">
        <button class="filter-chip ${STATE.filter.kelas === 'all' ? 'active' : ''}" onclick="STATE.filter.kelas='all'; renderRekap()">Semua Kelas</button>
        ${kelasSet.map(k => `<button class="filter-chip ${STATE.filter.kelas === k ? 'active' : ''}" onclick="STATE.filter.kelas='${escapeHtml(k)}'; renderRekap()">${escapeHtml(k)}</button>`).join('')}
      </div>
      <!-- Filter Kategori -->
      <div class="filter-bar">
        <button class="filter-chip ${STATE.filter.kategori === 'all' ? 'active' : ''}" onclick="STATE.filter.kategori='all'; renderRekap()">Semua Status</button>
        ${KATEGORI_LIST.map(k => `<button class="filter-chip ${STATE.filter.kategori === k.value ? 'active' : ''}" onclick="STATE.filter.kategori='${k.value}'; renderRekap()">${k.label}</button>`).join('')}
      </div>
      ${pengujiSet.length > 1 ? `
      <div class="filter-bar">
        <button class="filter-chip ${STATE.filter.penguji === 'all' ? 'active' : ''}" onclick="STATE.filter.penguji='all'; renderRekap()">Semua Penguji</button>
        ${pengujiSet.map(p => `<button class="filter-chip ${STATE.filter.penguji === p ? 'active' : ''}" onclick="STATE.filter.penguji='${escapeHtml(p)}'; renderRekap()">${escapeHtml(p)}</button>`).join('')}
      </div>` : ''}

      <div class="stats-grid">

          <div class="stat-number">${filtered.length}</div>
          <div class="stat-label">Siswa Dinilai</div>
        </div>
        <div class="stat-card stat-done">
          <div class="stat-number" style="color:${warnaNilai(rata)}">${rata.toFixed(2)}</div>
          <div class="stat-label">Rata-rata</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" style="color:#059669">${max.toFixed(2)}</div>
          <div class="stat-label">Tertinggi</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="color:#dc2626">${min.toFixed(2)}</div>
          <div class="stat-label">Terendah</div>

      <button class="btn btn-primary btn-full" onclick="exportRekapExcel()" style="margin-bottom:14px">
        <span class="material-symbols-outlined" style="font-size:17px">table_view</span>

      </button>

          const na = Number(p.nilai_akhir) || 0;
          const katInfo = getKategoriInfo(s.kategori);

// Rincian komponen nilai untuk modal detail rekap
function rincianNilaiHtml(p, s) {
  const f = n => Number(n || 0).toFixed(2);
  const baris = (label, nilai, bobot) => `
    <div class="flex-row flex-between" style="padding:8px 0;border-bottom:1px solid var(--line);font-size:14px">
      <span>${label}</span>
      <span><strong>${f(nilai)}</strong> <span class="text-muted">× ${Math.round(bobot * 100)}% = ${f(nilai * bobot)}</span></span>
    </div>`;
  const iqraBaru = getKategori(s) === 'TAHAP_IQRA' && p.baca_lancar != null;
  let html;
  if (iqraBaru) {
    const membaca = (Number(p.baca_lancar) + Number(p.baca_tajwid) + Number(p.baca_adab)) / 3;
    html = baris(`Membaca (${f(p.baca_lancar)} · ${f(p.baca_tajwid)} · ${f(p.baca_adab)})`, membaca, BOBOT_BACA_IQRA);
    if (p.hafalan_aktif) {
      const hafalan = hitungNilaiAkhir(p.nilai_kualitas, p.nilai_kuantitas);
      html += baris(`Hafalan, sistem Al-Qur'an (${f(p.jumlah_juz)} dari ${getTargetJuz(s.kelas)} juz)`, hafalan, BOBOT_HAFALAN_IQRA);
    }
  } else {
    html = baris('Kualitas (rata-rata surah)', p.nilai_kualitas, BOBOT_KUALITAS)
         + baris(`Kuantitas (${f(p.jumlah_juz)} dari ${getTargetJuz(s.kelas)} juz)`, p.nilai_kuantitas, BOBOT_KUANTITAS);
  }
  return `<div style="margin-top:12px">${html}</div>`;
}

function exportRekapExcel() {
  const data = window._rekapFiltered || [];
  if (!data.length) {
    showToast('⚠️ Tidak ada data untuk diekspor');
    return;
  }

  // Sheet 1: Rekap (satu baris per santri)
  const sheet1 = [
    ['NO','NISN','NAMA SANTRI','KELAS','STATUS','JUMLAH HAFALAN (JUZ)','SEMESTER','PENGUJI','TANGGAL','JUMLAH SURAH DINILAI','NILAI MEMBACA','JUZ TERSETOR','TARGET JUZ','NILAI KUALITAS','NILAI KUANTITAS','NILAI AKHIR','PREDIKAT','CATATAN']
  ];
  const f2 = n => Number(n || 0).toFixed(2);
  data.forEach((p, i) => {
    const s = p.siswa || {};
    const iqra = getKategori(s) === 'TAHAP_IQRA';
    const membaca = (iqra && p.baca_lancar != null)
      ? f2((Number(p.baca_lancar) + Number(p.baca_tajwid) + Number(p.baca_adab)) / 3) : '';
    sheet1.push([
      i+1,
      s.nisn || '',
      s.nama || '',
      s.kelas || '',
      getKategoriInfo(s.kategori).label,
      iqra ? '' : (s.jumlah_hafalan ?? ''),
      s.semester || '',
      p.penguji?.nama || '',
      p.tanggal_ujian || '',
      (p.nilai_detail||[]).length,
      membaca,
      f2(p.jumlah_juz),
      getTargetJuz(s.kelas),
      f2(p.nilai_kualitas),
      f2(p.nilai_kuantitas),
      f2(p.nilai_akhir),
      predikat(Number(p.nilai_akhir)),
      p.catatan || ''
    ]);
  });

  // Sheet 2: Detail per surah
  const sheet2 = [
    ['NISN','NAMA SISWA','KELAS','PENGUJI','SURAH','KELANCARAN (30%)','TAJWID (30%)','KEKUATAN HAFALAN (25%)','ADAB & TARTIL (15%)','TOTAL']
  ];
  data.forEach(p => {
    const s = p.siswa || {};
    const det = (p.nilai_detail || []).sort((a,b) => (a.urutan||0)-(b.urutan||0));
    det.forEach(d => {
      sheet2.push([
        s.nisn || '',
        s.nama || '',
        s.kelas || '',
        p.penguji?.nama || '',
        d.surah_nama,
        Number(d.kelancaran),
        Number(d.tajwid),
        Number(d.kekuatan_hafalan),
        Number(d.adab_tartil),
        Number(d.total).toFixed(2)
      ]);
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(sheet1);
  const ws2 = XLSX.utils.aoa_to_sheet(sheet2);
  ws1['!cols'] = [{wch:4},{wch:14},{wch:26},{wch:8},{wch:11},{wch:10},{wch:10},{wch:20},{wch:12},{wch:10},{wch:10},{wch:10},{wch:8},{wch:10},{wch:10},{wch:10},{wch:14},{wch:28}];
  ws2['!cols'] = [{wch:14},{wch:24},{wch:10},{wch:18},{wch:18},{wch:14},{wch:10},{wch:16},{wch:14},{wch:8}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Rekap Nilai');
  XLSX.utils.book_append_sheet(wb, ws2, 'Detail Surah');

  const fname = `Rekap_Tahfidz_${todayLocal()}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast('✅ Excel tersimpan: ' + fname);
}

function showModalGantiPassword() {
  showModal(`
    <div class="modal-header">

      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">

    </div>
    <div class="form-group">
      <label>Konfirmasi Password Baru</label>
      <input type="password" id="gpConfirm">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Batal</button>

    </div>
  `);

async function submitGantiPassword() {
  const oldP = document.getElementById('gpOld').value;
  const newP = document.getElementById('gpNew').value;
  const conf = document.getElementById('gpConfirm').value;
  if (!oldP || !newP) return showToast('⚠️ Lengkapi semua kolom');
  if (newP.length < 6) return showToast('⚠️ Password baru minimal 6 karakter');
  if (newP !== conf) return showToast('⚠️ Konfirmasi tidak cocok');

  const oldHash = await sha256(oldP);
  const { data, error } = await sb.from('penguji')
    .select('password').eq('id', STATE.user.id).single();
  if (error) return showToast('❌ Gagal: ' + error.message);
  if (data.password !== oldHash) return showToast('❌ Password lama salah');

  const newHash = await sha256(newP);
  const { error: e2 } = await sb.from('penguji')
    .update({ password: newHash }).eq('id', STATE.user.id);
  if (e2) return showToast('❌ Gagal: ' + e2.message);

  closeModal();
  showToast('✅ Password berhasil diubah');
}

  }
  return siswa.map(s => {

function filterSiswa(q) {
  const needle = q.toLowerCase().trim();
  const all = window._siswaCache || [];
  const filtered = !needle ? all : all.filter(s =>
    (s.nama||'').toLowerCase().includes(needle) ||
    (s.nisn||'').toLowerCase().includes(needle) ||
    (s.kelas||'').toLowerCase().includes(needle) ||
    (getKategoriInfo(s.kategori).label).toLowerCase().includes(needle)
  );
  document.getElementById('siswaList').innerHTML = renderSiswaListHtml(filtered);
}

async function submitSiswa(id) {
  const payload = {
    nama: document.getElementById('sfNama').value.trim(),
    nisn: document.getElementById('sfNisn').value.trim(),
    kelas: document.getElementById('sfKelas').value.trim(),
    jenis_kelamin: document.getElementById('sfJK').value,
    kategori: document.getElementById('sfKategori').value
  };
  if (!payload.nama) return showToast('⚠️ Nama wajib');
  if (!payload.nisn) return showToast('⚠️ NISN wajib');
  if (!payload.kelas) return showToast('⚠️ Kelas wajib');
  // Semester & tahun ajaran mengikuti Pengaturan → Lembaga (hanya diisi untuk santri baru)
  if (!id) {
    payload.semester = STATE.lembaga?.semester || 'Ganjil';
    payload.tahun_ajaran = STATE.lembaga?.tahun_ajaran || '';
  }

  showLoading('Menyimpan...');
  try {
    let siswaId = id;
    if (id) {
      const { error } = await sb.from('siswa').update(payload).eq('id', id);
      if (error) throw error;
    } else {
      const { data: newS, error } = await sb.from('siswa').insert(payload).select().single();
      if (error) throw error;
      siswaId = newS.id;
    }
    // Hitung ulang penilaian HANYA kalau kategori/kelas berubah (target kuantitas ikut berubah).
    // Edit lain (nama, NISN, dst.) tidak boleh menimpa nilai — termasuk override manual admin.
    if (id) {
      const lama = (window._siswaCache || []).find(x => x.id === id);
      const berubah = !lama
        || getKategori(lama) !== payload.kategori
        || (lama.kelas || '') !== payload.kelas;
      if (berubah) await recalcPenilaianForSiswa(id, { ...(lama || {}), ...payload });
    }
    hideLoading();
    closeModal();
    showToast('✅ Siswa tersimpan');
    renderAdminSiswa();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

function handleImportSiswaExcel(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length < 2) {
        showToast('⚠️ File kosong');
        return;
      }
      const headers = rows[0].map(h => String(h).toLowerCase().trim());
      const findIdx = (...keys) => headers.findIndex(h => keys.includes(h));
      const iNama = findIdx('nama','nama siswa','nama_siswa');
      const iNisn = findIdx('nisn','nis');
      const iKelas = findIdx('kelas','class');
      const iSmt = findIdx('semester','smt');
      const iJK = findIdx('jenis_kelamin','jk','kelamin','jenis kelamin');
      const iTA = findIdx('tahun_ajaran','ta','tahun ajaran');
      const iKat = findIdx('kategori','status','category','kategory');
      if (iNama === -1 || iKelas === -1) {
        showToast('❌ Kolom "nama" & "kelas" tidak ditemukan');
        return;
      }

      const VALID_KATEGORI = KATEGORI_LIST.map(k => k.value);
      const toInsert = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row[iNama]) continue;
        // Terima kode (ALQURAN_PEMULA) maupun label hasil Export ("Al-Qur'an Pemula")
        const katCell = iKat >= 0 ? String(row[iKat]||'').trim() : '';
        let katRaw = katCell.toUpperCase().replace(/\s+/g, '_');
        if (!VALID_KATEGORI.includes(katRaw)) {
          const norm = t => t.toLowerCase().replace(/[^a-z]/g, '');
          const byLabel = KATEGORI_LIST.find(k => norm(k.label) === norm(katCell));
          katRaw = byLabel ? byLabel.value : 'ALQURAN_LANJUT';
        }
        toInsert.push({
          nama: String(row[iNama]).trim(),
          nisn: iNisn >= 0 ? String(row[iNisn]||'').trim() : '',
          kelas: String(row[iKelas]||'').trim(),
          semester: (iSmt >= 0 && String(row[iSmt]||'').trim()) || STATE.lembaga?.semester || 'Ganjil',
          jenis_kelamin: iJK >= 0 ? String(row[iJK]||'').trim().toUpperCase().charAt(0) : '',
          tahun_ajaran: (iTA >= 0 && String(row[iTA]||'').trim()) || STATE.lembaga?.tahun_ajaran || '',
          kategori: katRaw
        });
      }

      if (!toInsert.length) {
        showToast('⚠️ Tidak ada baris valid');
        return;
      }

      showConfirm(
        'Import ' + toInsert.length + ' Siswa',
        'Data siswa akan ditambahkan ke database. Lanjutkan?',
        async () => {
          showLoading('Mengimpor...');
          try {
            // Insert bertahap (batch 100)
            for (let i = 0; i < toInsert.length; i += 100) {
              const batch = toInsert.slice(i, i + 100);
              const { error } = await sb.from('siswa').insert(batch);
              if (error) throw error;
            }
            hideLoading();
            showToast(`✅ Berhasil import ${toInsert.length} siswa`);
            renderAdminSiswa();
          } catch (err) {
            hideLoading();
            showToast('❌ Gagal: ' + err.message);
          }
        },
        '📊', 'Import', 'btn-primary'
      );
    } catch (err) {
      showToast('❌ Gagal baca Excel: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

async function submitPenguji(id) {
  const nama = document.getElementById('pfNama').value.trim();
  const username = document.getElementById('pfUser').value.trim();
  const password = document.getElementById('pfPass').value;
  const role = document.getElementById('pfRole').value;

  if (!nama) return showToast('⚠️ Nama wajib');
  if (!username) return showToast('⚠️ Username wajib');
  if (!id && !password) return showToast('⚠️ Password wajib untuk user baru');
  if (password && password.length < 6) return showToast('⚠️ Password minimal 6 karakter');

  showLoading('Menyimpan...');
  try {
    if (id) {
      const upd = { nama, role };
      if (password) upd.password = await sha256(password);
      const { error } = await sb.from('penguji').update(upd).eq('id', id);
      if (error) throw error;
    } else {
      const hash = await sha256(password);
      const { error } = await sb.from('penguji')
        .insert({ username, password: hash, nama, role });
      if (error) {
        if (error.code === '23505') throw new Error('Username sudah digunakan');
        throw error;
      }
    }
    hideLoading();
    closeModal();
    showToast('✅ Penguji tersimpan');
    renderAdminPenguji();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);

// Penugasan dikelompokkan per penguji; ketuk nama penguji untuk melihat santrinya
function renderAssignmentGroupsHtml(list, bukaSemua) {
  if (!list.length) {
    return '<div class="v-empty">Belum ada penugasan. Tekan "Bagi otomatis" untuk membagi santri ke penguji.</div>';
  }
  const grup = {};
  list.forEach(a => {
    const k = a.penguji_id;
    if (!grup[k]) grup[k] = { nama: a.penguji?.nama || '-', rows: [] };
    grup[k].rows.push(a);
  });
  return Object.values(grup)
    .sort((a, b) => a.nama.localeCompare(b.nama))
    .map(g => {
      const selesai = g.rows.filter(a => a.status === 'selesai').length;
      const persen = Math.round(selesai / g.rows.length * 100);
      const rows = g.rows.slice().sort((a, b) =>
        (a.siswa?.kelas || '').localeCompare(b.siswa?.kelas || '') || (a.siswa?.nama || '').localeCompare(b.siswa?.nama || ''));
      return `
        <details class="v-group" ${bukaSemua ? 'open' : ''}>
          <summary>
            <div class="v-group-row"><b>${escapeHtml(g.nama)}</b><span>${selesai} / ${g.rows.length} selesai</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${persen}%"></div></div>
          </summary>
          <div class="v-group-body">${renderAssignmentListHtml(rows)}</div>
        </details>`;
    }).join('');
}

async function submitAssignmentQuick(siswaId) {
  const penguji_id = document.getElementById('afPengujiQuick').value;

    ['nisn_siswa','nama_siswa','username_penguji','nama_penguji'],
    ['1234567890','Ahmad Fulan','ustadz1','Ust. Ahmad'],

// ── Export Assignment ke PDF (siap print A4 portrait) ─────────
async function exportAssignmentPDF() {
  // Cek library tersedia
  if (typeof window.jspdf === 'undefined') {
    showToast('❌ Library PDF belum siap, coba lagi sebentar');
    return;
  }

  const assignments = window._assignmentCache || [];
  if (!assignments.length) {
    showToast('⚠️ Belum ada assignment untuk di-export');
    return;
  }

  showLoading('Membuat PDF...');

  try {
    // Data lembaga untuk header
    const l = STATE.lembaga || {};

    // Sort: by kelas → by nama penguji → by nama siswa
    const sorted = [...assignments].sort((a, b) => {
      const ka = a.siswa?.kelas || '';
      const kb = b.siswa?.kelas || '';
      if (ka !== kb) return ka.localeCompare(kb);
      const pa = a.penguji?.nama || '';
      const pb = b.penguji?.nama || '';
      if (pa !== pb) return pa.localeCompare(pb);
      return (a.siswa?.nama || '').localeCompare(b.siswa?.nama || '');
    });

    // Statistik
    const totalAssign = sorted.length;
    const totalSelesai = sorted.filter(a => a.status === 'selesai').length;
    const totalBelum = totalAssign - totalSelesai;
    const pengujiSet = [...new Set(sorted.map(a => a.penguji?.nama).filter(Boolean))];
    const kelasSet = [...new Set(sorted.map(a => a.siswa?.kelas).filter(Boolean))];

    // Init jsPDF (A4 portrait)
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    // Dimensi A4: 210 x 297 mm
    const pageWidth = 210;
    const margin = 15;

    // ── Header ──
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(l.nama_lembaga || "MTs Al Imam Asy-Syafi'i", pageWidth / 2, 18, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(l.alamat || 'Tarakan, Kalimantan Utara', pageWidth / 2, 24, { align: 'center' });
    doc.text(`Tahun Ajaran ${l.tahun_ajaran || '-'}`, pageWidth / 2, 29, { align: 'center' });

    // Garis pembatas header
    doc.setLineWidth(0.5);
    doc.line(margin, 33, pageWidth - margin, 33);

    // Title dokumen
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text('DAFTAR PENUGASAN UJIAN TAHFIDZUL QUR\'AN', pageWidth / 2, 42, { align: 'center' });

    // Info ringkasan
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    doc.text(`Tanggal Cetak: ${today}`, margin, 50);
    doc.text(`Total: ${totalAssign} siswa | Selesai: ${totalSelesai} | Belum: ${totalBelum}`, margin, 55);
    doc.text(`Jumlah Penguji: ${pengujiSet.length} | Jumlah Kelas: ${kelasSet.length}`, margin, 60);

    // ── Tabel Assignment ──
    const body = sorted.map((a, i) => [
      i + 1,
      a.siswa?.nisn || '-',
      a.siswa?.nama || '-',
      a.siswa?.kelas || '-',
      a.siswa?.semester || '-',
      a.penguji?.nama || '-',
      a.status === 'selesai' ? 'Selesai' : 'Belum'
    ]);

    doc.autoTable({
      startY: 65,
      head: [['No', 'NISN', 'Nama Siswa', 'Kelas', 'Smt', 'Penguji', 'Status']],
      body: body,
      theme: 'grid',
      styles: {
        font: 'helvetica',
        fontSize: 8.5,
        cellPadding: 2,
        lineColor: [180, 180, 180],
        lineWidth: 0.1,
        textColor: [30, 30, 30]
      },
      headStyles: {
        fillColor: [37, 99, 235],        // primary blue
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        fontSize: 9,
        halign: 'center',
        cellPadding: 2.5
      },
      columnStyles: {
        0: { cellWidth: 10, halign: 'center' },                      // No
        1: { cellWidth: 24, halign: 'center' },                      // NISN
        2: { cellWidth: 50 },                                         // Nama Siswa
        3: { cellWidth: 15, halign: 'center' },                      // Kelas
        4: { cellWidth: 14, halign: 'center' },                      // Smt
        5: { cellWidth: 45 },                                         // Penguji
        6: { cellWidth: 22, halign: 'center', fontStyle: 'bold' }    // Status
      },
      alternateRowStyles: {
        fillColor: [239, 246, 255]       // very light blue
      },
      didParseCell: function (data) {
        // Warna status
        if (data.section === 'body' && data.column.index === 6) {
          if (data.cell.raw === 'Selesai') {
            data.cell.styles.textColor = [5, 150, 105];
            data.cell.styles.fillColor = [209, 250, 229];
          } else {
            data.cell.styles.textColor = [217, 119, 6];
            data.cell.styles.fillColor = [254, 243, 199];
          }
        }
      },
      margin: { left: margin, right: margin },
      didDrawPage: function (data) {
        // Footer: nomor halaman + tanggal
        const pageCount = doc.internal.getNumberOfPages();
        const pageCurrent = data.pageNumber;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(120, 120, 120);
        doc.text(
          `Halaman ${pageCurrent} dari ${pageCount}`,
          pageWidth - margin,
          290,
          { align: 'right' }
        );
        doc.text(
          `Dicetak: ${today}`,
          margin,
          290
        );
      }
    });

    // ── Halaman terakhir: Ringkasan per Penguji ──
    const finalY = doc.lastAutoTable.finalY || 70;
    const spaceLeft = 280 - finalY;

    if (spaceLeft > 60) {
      // Muat di halaman yang sama
      addRingkasanPenguji(doc, finalY + 8, sorted, pengujiSet, margin, pageWidth);
    } else {
      // Halaman baru
      doc.addPage();
      addRingkasanPenguji(doc, 20, sorted, pengujiSet, margin, pageWidth);
    }

    // ── Tanda tangan ──
    const sigY = Math.min(doc.lastAutoTable.finalY + 20, 270);
    if (sigY < 265) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(30, 30, 30);
      doc.text('Mengetahui,', pageWidth - 60, sigY, { align: 'center' });
      doc.text('Kepala Madrasah', pageWidth - 60, sigY + 5, { align: 'center' });
      doc.text('(_________________________)', pageWidth - 60, sigY + 25, { align: 'center' });
    }

    // Simpan
    const filename = `Daftar_Assignment_${todayLocal()}.pdf`;
    doc.save(filename);

    hideLoading();
    showToast('✅ PDF tersimpan: ' + filename);
  } catch (err) {
    hideLoading();
    console.error(err);
    showToast('❌ Gagal buat PDF: ' + err.message);
  }
}

// Helper: tambahkan ringkasan per penguji ke PDF
function addRingkasanPenguji(doc, startY, sorted, pengujiSet, margin, pageWidth) {
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(30, 30, 30);
  doc.text('RINGKASAN PER PENGUJI', margin, startY);

  const ringkasan = pengujiSet.map(nama => {
    const assigns = sorted.filter(a => a.penguji?.nama === nama);
    const total = assigns.length;
    const selesai = assigns.filter(a => a.status === 'selesai').length;
    return [
      nama,
      String(total),
      String(selesai),
      String(total - selesai),
      total ? `${Math.round((selesai / total) * 100)}%` : '0%'
    ];
  });

  doc.autoTable({
    startY: startY + 3,
    head: [['Nama Penguji', 'Total', 'Selesai', 'Belum', 'Progress']],
    body: ringkasan,
    theme: 'grid',
    styles: {
      font: 'helvetica',
      fontSize: 9,
      cellPadding: 2.5,
      lineColor: [180, 180, 180],
      lineWidth: 0.1
    },
    headStyles: {
      fillColor: [8, 145, 178],
      textColor: [255, 255, 255],
      fontStyle: 'bold',
      halign: 'center'
    },
    columnStyles: {
      0: { cellWidth: 70 },
      1: { cellWidth: 22, halign: 'center' },
      2: { cellWidth: 22, halign: 'center' },
      3: { cellWidth: 22, halign: 'center' },
      4: { cellWidth: 25, halign: 'center', fontStyle: 'bold' }
    },
    margin: { left: margin, right: margin }
  });
}

function handleImportAssignmentExcel(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      // Baca sheet pertama (atau "Template" jika ada)
      const sheetName = wb.SheetNames.includes('Template') ? 'Template' : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length < 2) {
        showToast('⚠️ File kosong');
        return;
      }

      const headers = rows[0].map(h => String(h).toLowerCase().trim());
      const findIdx = (...keys) => headers.findIndex(h => keys.includes(h));
      const iNisn = findIdx('nisn','nisn_siswa','nis');
      const iNamaSiswa = findIdx('nama','nama_siswa','siswa');
      const iUserPenguji = findIdx('username','username_penguji','user_penguji');
      const iNamaPenguji = findIdx('nama_penguji','penguji');

      if (iNisn === -1 && iNamaSiswa === -1) {
        showToast('❌ Butuh kolom nisn_siswa atau nama_siswa');
        return;
      }
      if (iUserPenguji === -1 && iNamaPenguji === -1) {
        showToast('❌ Butuh kolom username_penguji atau nama_penguji');
        return;
      }

      const allSiswa = window._siswaForAssignCache || [];
      const allPenguji = window._pengujiForAssignCache || [];
      const existingAssign = window._assignmentCache || [];
      const assignedIds = new Set(existingAssign.map(a => a.siswa_id));

      // Parse setiap baris
      const preview = []; // { siswa, penguji, status: 'ok'|'skip_assigned'|'siswa_nf'|'penguji_nf' }
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const nisn = iNisn >= 0 ? String(row[iNisn] || '').trim() : '';
        const namaSiswa = iNamaSiswa >= 0 ? String(row[iNamaSiswa] || '').trim() : '';
        const userPenguji = iUserPenguji >= 0 ? String(row[iUserPenguji] || '').trim() : '';
        const namaPenguji = iNamaPenguji >= 0 ? String(row[iNamaPenguji] || '').trim() : '';

        // Lewati baris kosong
        if (!nisn && !namaSiswa) continue;

        // Cari siswa
        let siswa = null;
        if (nisn) siswa = allSiswa.find(s => (s.nisn || '').trim() === nisn);
        if (!siswa && namaSiswa) siswa = allSiswa.find(s => (s.nama || '').trim().toLowerCase() === namaSiswa.toLowerCase());

        // Cari penguji
        let penguji = null;
        if (userPenguji) penguji = allPenguji.find(p => (p.username || '').trim().toLowerCase() === userPenguji.toLowerCase());
        if (!penguji && namaPenguji) penguji = allPenguji.find(p => (p.nama || '').trim().toLowerCase() === namaPenguji.toLowerCase());

        let status = 'ok';
        if (!siswa) status = 'siswa_nf';
        else if (!penguji) status = 'penguji_nf';
        else if (assignedIds.has(siswa.id)) status = 'skip_assigned';

        preview.push({
          row: r + 1,
          nisn, namaSiswa, userPenguji, namaPenguji,
          siswa, penguji, status
        });
      }

      if (!preview.length) {
        showToast('⚠️ Tidak ada baris valid');
        return;
      }

      // Tampilkan preview
      renderImportAssignmentPreview(preview);
    } catch (err) {
      showToast('❌ Gagal baca Excel: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

      </div>
    ` : ''}
    ${skipped.length > 0 ? `
      <div class="alert alert-warning">
        <span class="material-symbols-outlined" style="font-size:15px">info</span>
        <div>${skipped.length} siswa sudah punya assignment sebelumnya (di-skip). Gunakan Ganti Penguji jika ingin memindahkan.</div>

        <span class="material-symbols-outlined" style="font-size:15px">save</span>

}

async function submitImportAssignment(rows) {
  if (!rows.length) return;
  showLoading(`Menyimpan ${rows.length} assignment...`);
  try {
    let sukses = 0;
    // Insert per-batch 50 (untuk menghindari payload terlalu besar)
    for (let i = 0; i < rows.length; i += 50) {
      const batch = rows.slice(i, i + 50).map(r => ({ ...r, status: 'belum' }));
      const { error } = await sb.from('assignment').insert(batch);
      if (error) {
        // Kalau ada 1 yang duplicate, kita fallback ke insert satu per satu
        for (const r of batch) {
          const { error: e2 } = await sb.from('assignment').insert({ ...r, status: 'belum' });
          if (!e2) sukses++;
        }
      } else {
        sukses += batch.length;
      }
    }
    hideLoading();
    closeModal();
    showToast(`✅ ${sukses} assignment ter-import`);
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

async function submitAssignment() {
  const siswa_id = document.getElementById('afSiswa').value;
  const penguji_id = document.getElementById('afPenguji').value;

async function generateRandomAssignment() {
  const kelas = document.getElementById('arKelas').value;
  const pengujiIds = [...document.querySelectorAll('.arPenguji:checked')].map(x => x.value);
  const mode = document.querySelector('input[name="arMode"]:checked')?.value || 'campur';

  if (pengujiIds.length < 2) {
    showToast('⚠️ Pilih minimal 2 penguji');
    return;
  }

  const allSiswa = window._siswaForAssignCache || [];
  const allAssign = window._assignmentCache || [];

  // Filter siswa sesuai kelas
  let siswaList = kelas === 'all' ? allSiswa : allSiswa.filter(s => s.kelas === kelas);
  if (!siswaList.length) {
    showToast('⚠️ Tidak ada siswa di kelas tsb');
    return;
  }

  // HANYA assign siswa yang BELUM punya assignment apapun
  const assignedIds = new Set(allAssign.map(a => a.siswa_id));
  const jmlSebelum = siswaList.length;
  siswaList = siswaList.filter(s => !assignedIds.has(s.id));
  const jmlDiskip = jmlSebelum - siswaList.length;

  if (!siswaList.length) {
    showToast(`⚠️ Semua ${jmlSebelum} siswa sudah di-assign`);
    return;
  }

  // Ambil data penguji terpilih
  const allPenguji = window._pengujiForAssignCache || [];
  const pengujiTerpilih = allPenguji.filter(p => pengujiIds.includes(p.id));

  let pasangan;

  if (mode === 'per_kelas') {
    // Mode 2: Per Kelas — 1 penguji = 1 atau lebih kelas utuh
    const kelasList = [...new Set(siswaList.map(s => s.kelas || '').filter(Boolean))].sort();

    if (kelasList.length < pengujiIds.length) {
      if (!confirm(`Ada ${kelasList.length} kelas tapi ${pengujiIds.length} penguji dipilih. ${pengujiIds.length - kelasList.length} penguji tidak akan dapat siswa. Lanjutkan?`)) {
        return;
      }
    }

    // Shuffle urutan kelas supaya tidak always sama
    const shuffledKelas = [...kelasList];
    for (let i = shuffledKelas.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledKelas[i], shuffledKelas[j]] = [shuffledKelas[j], shuffledKelas[i]];
    }

    // Map kelas → penguji (round-robin)
    const kelasToPenguji = {};
    shuffledKelas.forEach((k, idx) => {
      kelasToPenguji[k] = pengujiIds[idx % pengujiIds.length];
    });

    pasangan = siswaList.map(s => ({
      siswa: s,
      penguji_id: kelasToPenguji[s.kelas] || pengujiIds[0]
    }));
  } else {
    // Mode 1: Campuran — shuffle semua siswa lalu bagi round-robin
    const shuffled = [...siswaList];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    pasangan = shuffled.map((s, idx) => ({
      siswa: s,
      penguji_id: pengujiIds[idx % pengujiIds.length]
    }));
  }

  RANDOM_STATE = { pasangan, pengujiTerpilih, jmlDiskip, mode, pengujiIds };
  renderRandomPreview();
}

function regenerateRandom() {
  const { pasangan, pengujiIds, mode } = RANDOM_STATE;
  const siswaList = pasangan.map(x => x.siswa);
  let newPasangan;

  if (mode === 'per_kelas') {
    const kelasList = [...new Set(siswaList.map(s => s.kelas || '').filter(Boolean))].sort();
    const shuffledKelas = [...kelasList];
    for (let i = shuffledKelas.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledKelas[i], shuffledKelas[j]] = [shuffledKelas[j], shuffledKelas[i]];
    }
    const kelasToPenguji = {};
    shuffledKelas.forEach((k, idx) => {
      kelasToPenguji[k] = pengujiIds[idx % pengujiIds.length];
    });
    newPasangan = siswaList.map(s => ({
      siswa: s,
      penguji_id: kelasToPenguji[s.kelas] || pengujiIds[0]
    }));
  } else {
    const shuffled = [...siswaList];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    newPasangan = shuffled.map((s, idx) => ({
      siswa: s,
      penguji_id: pengujiIds[idx % pengujiIds.length]
    }));
  }

  RANDOM_STATE.pasangan = newPasangan;
  renderRandomPreview();
  showToast('🎲 Diacak ulang');
}

async function simpanRandomAssignment() {
  const { pasangan, jmlDiskip } = RANDOM_STATE;
  if (!pasangan.length) return;

  showLoading(`Menyimpan ${pasangan.length} penugasan...`);

    let sukses = 0;
    for (const p of pasangan) {
      const { error } = await sb.from('assignment')
        .insert({ siswa_id: p.siswa.id, penguji_id: p.penguji_id, status: 'belum' });
      if (!error) sukses++;
      else if (error.code !== '23505') throw error;
    }
    hideLoading();
    closeModal();
    let msg = `✅ ${sukses} penugasan dibuat`;
    if (jmlDiskip) msg += ` (${jmlDiskip} siswa di-skip karena sudah di-assign sebelumnya)`;
    showToast(msg);

async function submitGantiPenguji(assignmentId) {
  const newPengujiId = document.getElementById('gpPenguji').value;
  if (!newPengujiId) return showToast('⚠️ Pilih penguji baru');

  const assignments = window._assignmentCache || [];
  const a = assignments.find(x => x.id === assignmentId);
  if (!a) return showToast('❌ Assignment tidak ditemukan');

  showLoading('Mengganti penguji...');
  try {
    // Hapus penilaian lama (jika ada) karena penguji berbeda
    const { error: eDel } = await sb.from('penilaian').delete()
      .eq('siswa_id', a.siswa_id)
      .eq('penguji_id', a.penguji_id);
    if (eDel) throw eDel;

    // Update assignment ke penguji baru, reset status ke 'belum'
    const { error } = await sb.from('assignment')
      .update({ penguji_id: newPengujiId, status: 'belum' })
      .eq('id', assignmentId);
    if (error) throw error;

    hideLoading();
    closeModal();
    showToast('✅ Penguji berhasil diganti');
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

function deleteAssignment(id) {
  showConfirm(
    'Hapus Penugasan',
    'Penugasan dan nilai terkait akan dihapus. Lanjutkan?',
    async () => {
      showLoading('Menghapus...');
      try {
        // Hapus penilaian terkait dulu
        const asg = (window._assignmentCache || []).find(a => a.id === id);
        if (asg) {
          const { error: eDel } = await sb.from('penilaian').delete()
            .eq('siswa_id', asg.siswa_id)
            .eq('penguji_id', asg.penguji_id);
          if (eDel) throw eDel;
        }
        const { error } = await sb.from('assignment').delete().eq('id', id);
        if (error) throw error;
        hideLoading();
        showToast('🗑️ Dihapus');
        renderAdminAssignment();
      } catch (e) {
        hideLoading();
        showToast('❌ ' + e.message);
      }
    },
    '🗑️', 'Hapus', 'btn-danger'
  );
}
