function handleImportSiswaExcel(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length < 2) {
        showToast('⚠️ File kosong');
        return;
      }
      const headers = rows[0].map(h => String(h).toLowerCase().trim());
      const findIdx = (...keys) => headers.findIndex(h => keys.includes(h));
      const iNama = findIdx('nama','nama siswa','nama_siswa');
      const iNisn = findIdx('nisn','nis');
      const iKelas = findIdx('kelas','class');
      const iSmt = findIdx('semester','smt');
      const iJK = findIdx('jenis_kelamin','jk','kelamin','jenis kelamin');
      const iTA = findIdx('tahun_ajaran','ta','tahun ajaran');
      const iKat = findIdx('kategori','category','kategory');
      if (iNama === -1 || iKelas === -1) {
        showToast('❌ Kolom "nama" & "kelas" tidak ditemukan');
        return;
      }

      const VALID_KATEGORI = KATEGORI_LIST.map(k => k.value);
      const toInsert = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row[iNama]) continue;
        let katRaw = iKat >= 0 ? String(row[iKat]||'').trim().toUpperCase() : '';
        if (!VALID_KATEGORI.includes(katRaw)) katRaw = 'ALQURAN_LANJUT';
        toInsert.push({
          nama: String(row[iNama]).trim(),
          nisn: iNisn >= 0 ? String(row[iNisn]||'').trim() : '',
          kelas: String(row[iKelas]||'').trim(),
          semester: iSmt >= 0 ? String(row[iSmt]||'').trim() : 'Ganjil',
          jenis_kelamin: iJK >= 0 ? String(row[iJK]||'').trim().toUpperCase().charAt(0) : '',
          tahun_ajaran: iTA >= 0 ? String(row[iTA]||'').trim() : STATE.lembaga.tahun_ajaran,
          kategori: katRaw
        });
      }

      if (!toInsert.length) {
        showToast('⚠️ Tidak ada baris valid');
        return;
      }

      showConfirm(
        'Import ' + toInsert.length + ' Siswa',
        'Data siswa akan ditambahkan ke database. Lanjutkan?',
        async () => {
          showLoading('Mengimpor...');
          try {
            // Insert bertahap (batch 100)
            for (let i = 0; i < toInsert.length; i += 100) {
              const batch = toInsert.slice(i, i + 100);
              const { error } = await sb.from('siswa').insert(batch);
              if (error) throw error;
            }
            hideLoading();
            showToast(`✅ Berhasil import ${toInsert.length} siswa`);
            renderAdminSiswa();
          } catch (err) {
            hideLoading();
            showToast('❌ Gagal: ' + err.message);
          }
        },
        '📊', 'Import', 'btn-primary'
      );
    } catch (err) {
      showToast('❌ Gagal baca Excel: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

async function submitPenguji(id) {
  const nama = document.getElementById('pfNama').value.trim();
  const username = document.getElementById('pfUser').value.trim();
  const password = document.getElementById('pfPass').value;
  const role = document.getElementById('pfRole').value;

  if (!nama) return showToast('⚠️ Nama wajib');
  if (!username) return showToast('⚠️ Username wajib');
  if (!id && !password) return showToast('⚠️ Password wajib untuk user baru');
  if (password && password.length < 6) return showToast('⚠️ Password minimal 6 karakter');

  showLoading('Menyimpan...');
  try {
    if (id) {
      const upd = { nama, role };
      if (password) upd.password = await sha256(password);
      const { error } = await sb.from('penguji').update(upd).eq('id', id);
      if (error) throw error;
    } else {
      const hash = await sha256(password);
      const { error } = await sb.from('penguji')
        .insert({ username, password: hash, nama, role });
      if (error) {
        if (error.code === '23505') throw new Error('Username sudah digunakan');
        throw error;
      }
    }
    hideLoading();
    closeModal();
    showToast('✅ Penguji tersimpan');
    renderAdminPenguji();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

}

function filterAssignment(q) {

    const s = a.siswa || {}, p = a.penguji || {};
    return (s.nama||'').toLowerCase().includes(needle) ||
           (p.nama||'').toLowerCase().includes(needle) ||
           (s.kelas||'').toLowerCase().includes(needle);
  });
  document.getElementById('assignmentList').innerHTML = renderAssignmentListHtml(filtered);
}

function downloadTemplateAssignment() {
  const siswa = window._siswaForAssignCache || [];
  const penguji = window._pengujiForAssignCache || [];
  // Sheet Template: contoh baris isi + daftar siswa & penguji yang tersedia
  const wb = XLSX.utils.book_new();

  // Sheet 1: Template (yang diisi user)
  const tpl = [
    ['nisn_siswa','nama_siswa','username_penguji','nama_penguji'],
    ['1234567890','Ahmad Fulan','ustadz1','Ust. Ahmad'],
    ['','','','(kosongkan baris ini, hanya contoh)']
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(tpl);
  ws1['!cols'] = [{wch:14},{wch:24},{wch:18},{wch:20}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Template');

  // Sheet 2: Daftar Siswa (referensi)
  const dataSiswa = [['nisn','nama','kelas']];
  siswa.forEach(s => dataSiswa.push([s.nisn || '', s.nama || '', s.kelas || '']));
  const ws2 = XLSX.utils.aoa_to_sheet(dataSiswa);
  ws2['!cols'] = [{wch:14},{wch:24},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Daftar Siswa');

  // Sheet 3: Daftar Penguji (referensi)
  const dataPenguji = [['username','nama','role']];
  penguji.forEach(p => dataPenguji.push([p.username || '', p.nama || '', p.role || '']));
  const ws3 = XLSX.utils.aoa_to_sheet(dataPenguji);
  ws3['!cols'] = [{wch:18},{wch:22},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Daftar Penguji');

  XLSX.writeFile(wb, 'Template_Import_Assignment.xlsx');
  showToast('✅ Template diunduh (cek sheet Template)');
}

// ── Export Assignment ke PDF (siap print A4 portrait) ─────────
async function exportAssignmentPDF() {
  // Cek library tersedia
  if (typeof window.jspdf === 'undefined') {
    showToast('❌ Library PDF belum siap, coba lagi sebentar');
    return;
  }

  const assignments = window._assignmentCache || [];
  if (!assignments.length) {
    showToast('⚠️ Belum ada assignment untuk di-export');
    return;
  }

  showLoading('Membuat PDF...');

  try {
    // Data lembaga untuk header
    const l = STATE.lembaga || {};

    // Sort: by kelas → by nama penguji → by nama siswa
    const sorted = [...assignments].sort((a, b) => {
      const ka = a.siswa?.kelas || '';
      const kb = b.siswa?.kelas || '';
      if (ka !== kb) return ka.localeCompare(kb);
      const pa = a.penguji?.nama || '';
      const pb = b.penguji?.nama || '';
      if (pa !== pb) return pa.localeCompare(pb);
      return (a.siswa?.nama || '').localeCompare(b.siswa?.nama || '');
    });

    // Statistik
    const totalAssign = sorted.length;
    const totalSelesai = sorted.filter(a => a.status === 'selesai').length;
    const totalBelum = totalAssign - totalSelesai;
    const pengujiSet = [...new Set(sorted.map(a => a.penguji?.nama).filter(Boolean))];
    const kelasSet = [...new Set(sorted.map(a => a.siswa?.kelas).filter(Boolean))];

    // Init jsPDF (A4 portrait)
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    // Dimensi A4: 210 x 297 mm
    const pageWidth = 210;
    const margin = 15;

    // ── Header ──
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(l.nama_lembaga || "MTs Al Imam Asy-Syafi'i", pageWidth / 2, 18, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(l.alamat || 'Tarakan, Kalimantan Utara', pageWidth / 2, 24, { align: 'center' });
    doc.text(`Tahun Ajaran ${l.tahun_ajaran || '-'}`, pageWidth / 2, 29, { align: 'center' });

    // Garis pembatas header
    doc.setLineWidth(0.5);
    doc.line(margin, 33, pageWidth - margin, 33);

    // Title dokumen
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text('DAFTAR PENUGASAN UJIAN TAHFIDZUL QUR\'AN', pageWidth / 2, 42, { align: 'center' });

    // Info ringkasan
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);

        1: { cellWidth: 24, halign: 'center' },                      // NISN
        2: { cellWidth: 50 },                                         // Nama Siswa

        4: { cellWidth: 14, halign: 'center' },                      // Smt

      alternateRowStyles: {
        fillColor: [239, 246, 255]       // very light blue
      },
      didParseCell: function (data) {

            data.cell.styles.textColor = [5, 150, 105];
            data.cell.styles.fillColor = [209, 250, 229];
          } else {
            data.cell.styles.textColor = [217, 119, 6];
            data.cell.styles.fillColor = [254, 243, 199];
          }
        }
      },
      margin: { left: margin, right: margin },
      didDrawPage: function (data) {
        // Footer: nomor halaman + tanggal
        const pageCount = doc.internal.getNumberOfPages();
        const pageCurrent = data.pageNumber;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(120, 120, 120);
        doc.text(
          `Halaman ${pageCurrent} dari ${pageCount}`,
          pageWidth - margin,
          290,
          { align: 'right' }
        );
        doc.text(
          `Dicetak: ${today}`,
          margin,
          290

      }
    });

    // ── Halaman terakhir: Ringkasan per Penguji ──
    const finalY = doc.lastAutoTable.finalY || 70;

      // Muat di halaman yang sama
      addRingkasanPenguji(doc, finalY + 8, sorted, pengujiSet, margin, pageWidth);
    } else {
      // Halaman baru
      doc.addPage();
      addRingkasanPenguji(doc, 20, sorted, pengujiSet, margin, pageWidth);
    }

    // ── Tanda tangan ──
    const sigY = Math.min(doc.lastAutoTable.finalY + 20, 270);
    if (sigY < 265) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(30, 30, 30);
      doc.text('Mengetahui,', pageWidth - 60, sigY, { align: 'center' });
      doc.text('Kepala Madrasah', pageWidth - 60, sigY + 5, { align: 'center' });
      doc.text('(_________________________)', pageWidth - 60, sigY + 25, { align: 'center' });
    }

    // Simpan
    const filename = `Daftar_Assignment_${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(filename);

    hideLoading();
    showToast('✅ PDF tersimpan: ' + filename);
  } catch (err) {
    hideLoading();
    console.error(err);
    showToast('❌ Gagal buat PDF: ' + err.message);

function addRingkasanPenguji(doc, startY, sorted, pengujiSet, margin, pageWidth) {
  doc.setFont('helvetica', 'bold');

  doc.setTextColor(30, 30, 30);

      String(total),
      String(selesai),
      String(total - selesai),
      total ? `${Math.round((selesai / total) * 100)}%` : '0%'

    startY: startY + 3,

function handleImportAssignmentExcel(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      // Baca sheet pertama (atau "Template" jika ada)
      const sheetName = wb.SheetNames.includes('Template') ? 'Template' : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length < 2) {
        showToast('⚠️ File kosong');
        return;
      }

      const headers = rows[0].map(h => String(h).toLowerCase().trim());
      const findIdx = (...keys) => headers.findIndex(h => keys.includes(h));
      const iNisn = findIdx('nisn','nisn_siswa','nis');
      const iNamaSiswa = findIdx('nama','nama_siswa','siswa');
      const iUserPenguji = findIdx('username','username_penguji','user_penguji');
      const iNamaPenguji = findIdx('nama_penguji','penguji');

      if (iNisn === -1 && iNamaSiswa === -1) {
        showToast('❌ Butuh kolom nisn_siswa atau nama_siswa');
        return;
      }
      if (iUserPenguji === -1 && iNamaPenguji === -1) {
        showToast('❌ Butuh kolom username_penguji atau nama_penguji');
        return;
      }

      const allSiswa = window._siswaForAssignCache || [];
      const allPenguji = window._pengujiForAssignCache || [];
      const existingAssign = window._assignmentCache || [];
      const assignedIds = new Set(existingAssign.map(a => a.siswa_id));

      // Parse setiap baris
      const preview = []; // { siswa, penguji, status: 'ok'|'skip_assigned'|'siswa_nf'|'penguji_nf' }
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const nisn = iNisn >= 0 ? String(row[iNisn] || '').trim() : '';
        const namaSiswa = iNamaSiswa >= 0 ? String(row[iNamaSiswa] || '').trim() : '';
        const userPenguji = iUserPenguji >= 0 ? String(row[iUserPenguji] || '').trim() : '';
        const namaPenguji = iNamaPenguji >= 0 ? String(row[iNamaPenguji] || '').trim() : '';

        // Lewati baris kosong
        if (!nisn && !namaSiswa) continue;

        // Cari siswa
        let siswa = null;
        if (nisn) siswa = allSiswa.find(s => (s.nisn || '').trim() === nisn);
        if (!siswa && namaSiswa) siswa = allSiswa.find(s => (s.nama || '').trim().toLowerCase() === namaSiswa.toLowerCase());

        // Cari penguji
        let penguji = null;
        if (userPenguji) penguji = allPenguji.find(p => (p.username || '').trim().toLowerCase() === userPenguji.toLowerCase());
        if (!penguji && namaPenguji) penguji = allPenguji.find(p => (p.nama || '').trim().toLowerCase() === namaPenguji.toLowerCase());

        let status = 'ok';
        if (!siswa) status = 'siswa_nf';
        else if (!penguji) status = 'penguji_nf';
        else if (assignedIds.has(siswa.id)) status = 'skip_assigned';

        preview.push({
          row: r + 1,
          nisn, namaSiswa, userPenguji, namaPenguji,
          siswa, penguji, status
        });
      }

      if (!preview.length) {
        showToast('⚠️ Tidak ada baris valid');
        return;
      }

      // Tampilkan preview
      renderImportAssignmentPreview(preview);
    } catch (err) {
      showToast('❌ Gagal baca Excel: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

async function submitImportAssignment(rows) {
  if (!rows.length) return;
  showLoading(`Menyimpan ${rows.length} assignment...`);
  try {
    let sukses = 0;
    // Insert per-batch 50 (untuk menghindari payload terlalu besar)
    for (let i = 0; i < rows.length; i += 50) {
      const batch = rows.slice(i, i + 50).map(r => ({ ...r, status: 'belum' }));
      const { error } = await sb.from('assignment').insert(batch);
      if (error) {
        // Kalau ada 1 yang duplicate, kita fallback ke insert satu per satu
        for (const r of batch) {
          const { error: e2 } = await sb.from('assignment').insert({ ...r, status: 'belum' });
          if (!e2) sukses++;
        }
      } else {
        sukses += batch.length;
      }
    }
    hideLoading();
    closeModal();
    showToast(`✅ ${sukses} assignment ter-import`);
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

async function submitAssignment() {
  const siswa_id = document.getElementById('afSiswa').value;
  const penguji_id = document.getElementById('afPenguji').value;
  if (!siswa_id || !penguji_id) return showToast('⚠️ Pilih siswa & penguji');

  // Safety check: pastikan siswa belum punya assignment
  const existing = (window._assignmentCache || []).find(a => a.siswa_id === siswa_id);
  if (existing) {
    showToast('⚠️ Siswa sudah di-assign ke ' + (existing.penguji?.nama || 'penguji lain'));
    return;
  }

  showLoading('Menyimpan...');
  try {
    const { error } = await sb.from('assignment').insert({ siswa_id, penguji_id, status: 'belum' });
    if (error) {
      if (error.code === '23505') throw new Error('Siswa sudah ditugaskan');
      throw error;
    }
    hideLoading();
    closeModal();
    showToast('✅ Penugasan dibuat');
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

async function submitAssignmentBulk() {
  const kelas = document.getElementById('abKelas').value;
  const penguji_id = document.getElementById('abPenguji').value;
  if (!kelas || !penguji_id) return showToast('⚠️ Lengkapi pilihan');
  const siswaKelas = (window._siswaForAssignCache || []).filter(s => s.kelas === kelas);
  if (!siswaKelas.length) return showToast('⚠️ Tidak ada siswa di kelas tsb');

  // Skip siswa yang sudah punya assignment apapun
  const assignedIds = new Set((window._assignmentCache || []).map(a => a.siswa_id));
  const siswaBelum = siswaKelas.filter(s => !assignedIds.has(s.id));
  const sudahAssign = siswaKelas.length - siswaBelum.length;

  if (!siswaBelum.length) {
    showToast(`⚠️ Semua ${siswaKelas.length} siswa kelas ini sudah di-assign`);
    return;
  }

  showLoading(`Menugaskan ${siswaBelum.length} siswa...`);
  try {
    const rows = siswaBelum.map(s => ({ siswa_id: s.id, penguji_id, status: 'belum' }));
    let sukses = 0;
    for (const r of rows) {
      const { error } = await sb.from('assignment').insert(r);
      if (!error) sukses++;
      else throw error;
    }
    hideLoading();
    closeModal();
    let msg = `✅ ${sukses} penugasan dibuat`;
    if (sudahAssign) msg += ` (${sudahAssign} siswa di-skip karena sudah di-assign)`;
    showToast(msg);
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

async function generateRandomAssignment() {
  const kelas = document.getElementById('arKelas').value;
  const pengujiIds = [...document.querySelectorAll('.arPenguji:checked')].map(x => x.value);
  const mode = document.querySelector('input[name="arMode"]:checked')?.value || 'campur';

  if (pengujiIds.length < 2) {
    showToast('⚠️ Pilih minimal 2 penguji');
    return;
  }

  const allSiswa = window._siswaForAssignCache || [];
  const allAssign = window._assignmentCache || [];

  // Filter siswa sesuai kelas
  let siswaList = kelas === 'all' ? allSiswa : allSiswa.filter(s => s.kelas === kelas);
  if (!siswaList.length) {
    showToast('⚠️ Tidak ada siswa di kelas tsb');
    return;
  }

  // HANYA assign siswa yang BELUM punya assignment apapun
  const assignedIds = new Set(allAssign.map(a => a.siswa_id));
  const jmlSebelum = siswaList.length;
  siswaList = siswaList.filter(s => !assignedIds.has(s.id));
  const jmlDiskip = jmlSebelum - siswaList.length;

  if (!siswaList.length) {
    showToast(`⚠️ Semua ${jmlSebelum} siswa sudah di-assign`);
    return;
  }

  // Ambil data penguji terpilih
  const allPenguji = window._pengujiForAssignCache || [];
  const pengujiTerpilih = allPenguji.filter(p => pengujiIds.includes(p.id));

  let pasangan;

  if (mode === 'per_kelas') {
    // Mode 2: Per Kelas — 1 penguji = 1 atau lebih kelas utuh
    const kelasList = [...new Set(siswaList.map(s => s.kelas || '').filter(Boolean))].sort();

    if (kelasList.length < pengujiIds.length) {
      if (!confirm(`Ada ${kelasList.length} kelas tapi ${pengujiIds.length} penguji dipilih. ${pengujiIds.length - kelasList.length} penguji tidak akan dapat siswa. Lanjutkan?`)) {
        return;
      }
    }

    // Shuffle urutan kelas supaya tidak always sama
    const shuffledKelas = [...kelasList];
    for (let i = shuffledKelas.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledKelas[i], shuffledKelas[j]] = [shuffledKelas[j], shuffledKelas[i]];
    }

    // Map kelas → penguji (round-robin)
    const kelasToPenguji = {};
    shuffledKelas.forEach((k, idx) => {
      kelasToPenguji[k] = pengujiIds[idx % pengujiIds.length];
    });

    pasangan = siswaList.map(s => ({
      siswa: s,
      penguji_id: kelasToPenguji[s.kelas] || pengujiIds[0]
    }));
  } else {
    // Mode 1: Campuran — shuffle semua siswa lalu bagi round-robin
    const shuffled = [...siswaList];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    pasangan = shuffled.map((s, idx) => ({
      siswa: s,
      penguji_id: pengujiIds[idx % pengujiIds.length]
    }));
  }

  RANDOM_STATE = { pasangan, pengujiTerpilih, jmlDiskip, mode, pengujiIds };
  renderRandomPreview();
}

function regenerateRandom() {
  const { pasangan, pengujiIds, mode } = RANDOM_STATE;
  const siswaList = pasangan.map(x => x.siswa);
  let newPasangan;

  if (mode === 'per_kelas') {
    const kelasList = [...new Set(siswaList.map(s => s.kelas || '').filter(Boolean))].sort();
    const shuffledKelas = [...kelasList];
    for (let i = shuffledKelas.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledKelas[i], shuffledKelas[j]] = [shuffledKelas[j], shuffledKelas[i]];
    }
    const kelasToPenguji = {};
    shuffledKelas.forEach((k, idx) => {
      kelasToPenguji[k] = pengujiIds[idx % pengujiIds.length];
    });
    newPasangan = siswaList.map(s => ({
      siswa: s,
      penguji_id: kelasToPenguji[s.kelas] || pengujiIds[0]
    }));
  } else {
    const shuffled = [...siswaList];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    newPasangan = shuffled.map((s, idx) => ({
      siswa: s,
      penguji_id: pengujiIds[idx % pengujiIds.length]
    }));
  }

  RANDOM_STATE.pasangan = newPasangan;
  renderRandomPreview();
  showToast('🎲 Diacak ulang');
}

async function simpanRandomAssignment() {
  const { pasangan, jmlDiskip } = RANDOM_STATE;
  if (!pasangan.length) return;

  showLoading(`Menyimpan ${pasangan.length} penugasan...`);
  try {
    let sukses = 0;
    for (const p of pasangan) {
      const { error } = await sb.from('assignment')
        .insert({ siswa_id: p.siswa.id, penguji_id: p.penguji_id, status: 'belum' });
      if (!error) sukses++;
      else if (error.code !== '23505') throw error;
    }
    hideLoading();
    closeModal();
    let msg = `✅ ${sukses} penugasan dibuat`;
    if (jmlDiskip) msg += ` (${jmlDiskip} siswa di-skip karena sudah di-assign sebelumnya)`;
    showToast(msg);
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

async function submitGantiPenguji(assignmentId) {
  const newPengujiId = document.getElementById('gpPenguji').value;
  if (!newPengujiId) return showToast('⚠️ Pilih penguji baru');

  const assignments = window._assignmentCache || [];
  const a = assignments.find(x => x.id === assignmentId);
  if (!a) return showToast('❌ Assignment tidak ditemukan');

  showLoading('Mengganti penguji...');
  try {
    // Hapus penilaian lama (jika ada) karena penguji berbeda
    await sb.from('penilaian').delete()
      .eq('siswa_id', a.siswa_id)
      .eq('penguji_id', a.penguji_id);

    // Update assignment ke penguji baru, reset status ke 'belum'
    const { error } = await sb.from('assignment')
      .update({ penguji_id: newPengujiId, status: 'belum' })
      .eq('id', assignmentId);
    if (error) throw error;

    hideLoading();
    closeModal();
    showToast('✅ Penguji berhasil diganti');
    renderAdminAssignment();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

function deleteAssignment(id) {
  showConfirm(
    'Hapus Penugasan',
    'Penugasan dan nilai terkait akan dihapus. Lanjutkan?',
    async () => {
      showLoading('Menghapus...');
      try {
        // Hapus penilaian terkait dulu
        const asg = (window._assignmentCache || []).find(a => a.id === id);
        if (asg) {
          await sb.from('penilaian').delete()
            .eq('siswa_id', asg.siswa_id)
            .eq('penguji_id', asg.penguji_id);
        }
        const { error } = await sb.from('assignment').delete().eq('id', id);
        if (error) throw error;
        hideLoading();
        showToast('🗑️ Dihapus');
        renderAdminAssignment();
      } catch (e) {
        hideLoading();
        showToast('❌ ' + e.message);
      }
    },
    '🗑️', 'Hapus', 'btn-danger'
  );
}

    const aktif = data.filter(s => s.aktif).length;
    getTabBodyEl().innerHTML = `

        </p>
        <div class="grid-2" style="gap:8px;margin-bottom:10px">
          <button class="btn btn-outline btn-sm" onclick="toggleAllSurah(true)">✓ Aktifkan Semua</button>
          <button class="btn btn-outline btn-sm" onclick="toggleAllSurah(false)">✗ Nonaktif Semua</button>

function renderSurahListHtml(list) {
  if (!list.length) return '<p class="text-center text-muted">Belum ada data surah</p>';
  return `<div style="display:grid;grid-template-columns:1fr;gap:6px">${list.map(s => `
    <div class="list-item" style="padding:9px 12px">
      <div class="list-avatar" style="width:36px;height:36px;font-size:13px">${s.nomor}</div>
      <div class="list-info">
        <div class="list-name" style="font-size:13px">${escapeHtml(s.nama)} ${s.nama_arab ? `<span style="font-family:Amiri,serif;color:var(--primary)">${s.nama_arab}</span>` : ''}</div>
        <div class="list-meta">${s.jumlah_ayat} ayat</div>
      </div>
      <div class="list-actions">
        <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer">
          <input type="checkbox" ${s.aktif ? 'checked' : ''} onchange="toggleSurah('${s.id}', this.checked)"
                 style="width:16px;height:16px;accent-color:var(--primary)">
        </label>
      </div>
    </div>
  `).join('')}</div>`;
}

function filterSurah(q) {
  const needle = q.toLowerCase().trim();
  const all = window._surahCache || [];
  const filtered = !needle ? all : all.filter(s =>
    (s.nama||'').toLowerCase().includes(needle) ||
    String(s.nomor).includes(needle)
  );
  document.getElementById('surahList').innerHTML = renderSurahListHtml(filtered);
}

async function toggleSurah(id, aktif) {
  try {
    const { error } = await sb.from('surah').update({ aktif }).eq('id', id);
    if (error) throw error;
    const s = (window._surahCache || []).find(x => x.id === id);
    if (s) s.aktif = aktif;
  } catch (e) {
    showToast('❌ ' + e.message);
  }
}

async function toggleAllSurah(aktif) {
  showLoading('Memperbarui...');
  try {
    const { error } = await sb.from('surah').update({ aktif })
      .gt('nomor', 0);
    if (error) throw error;
    hideLoading();
    showToast(`✅ Semua surah ${aktif ? 'diaktifkan' : 'dinonaktifkan'}`);
    renderAdminSurah();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

                  <div class="list-meta">
                    <span class="badge" style="${isArsip ? 'background:#f3f4f6;color:#6b7280' : 'background:#d1fae5;color:#047857'}">
                      ${isArsip ? 'Diarsipkan — tersembunyi dari semua' : 'Aktif — tampil di semua pengguna'}
                    </span>
                  </div>
                </div>
                <div class="list-actions">
                  <button class="btn ${isArsip ? 'btn-outline' : 'btn-danger'} btn-sm"
                    onclick="toggleKelasArsip('${escapeHtml(k)}')">
                    ${isArsip ? '✓ Aktifkan' : '📦 Arsipkan'}
                  </button>
                </div>
              </div>
            `;
          }).join('')}
    </div>
    <div class="card" style="background:#fef9c3;border:1px solid #fde047">
      <div class="card-title" style="color:#854d0e">ℹ️ Catatan</div>
      <p class="text-small" style="color:#854d0e;margin:0">
        Kelas diarsipkan → tersembunyi dari tampilan Input Penilaian dan Tugas Menilai. Data tetap ada di Rekap.
      </p>
    </div>
  `;
}

async function toggleKelasArsip(kelas) {
  const arsip = [...(STATE.kelasArsip || [])];
  const idx = arsip.indexOf(kelas);
  if (idx >= 0) {
    arsip.splice(idx, 1);
  } else {
    arsip.push(kelas);
  }

  showLoading('Menyimpan...');
  try {
    const { error } = await sb.from('pengaturan')
      .update({ kelas_arsip: JSON.stringify(arsip) })
      .eq('id', 1);
    if (error) throw error;

    // Verifikasi: baca ulang dari DB untuk memastikan tersimpan
    const { data: check, error: checkErr } = await sb.from('pengaturan')
      .select('kelas_arsip').eq('id', 1).single();
    if (checkErr) throw checkErr;

    const tersimpan = JSON.parse(check?.kelas_arsip || '[]');
    const berhasil = idx >= 0 ? !tersimpan.includes(kelas) : tersimpan.includes(kelas);
    if (!berhasil) throw new Error('Data tidak tersimpan. Pastikan kolom kelas_arsip ada di tabel pengaturan dan schema cache Supabase sudah di-reload (Settings → API → Reload).');

    STATE.kelasArsip = tersimpan;
    hideLoading();
    showToast(idx >= 0 ? `✅ Kelas ${kelas} diaktifkan` : `📦 Kelas ${kelas} diarsipkan`);
    renderTabKelas();
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message);
  }
}

function resetAllPenilaian() {
  showConfirm(
    'Hapus Semua Penilaian',
    'Semua nilai ujian akan dihapus permanen. Data siswa, penguji, dan assignment tetap ada, namun status assignment direset ke "belum". Lanjutkan?',
    async () => {
      showLoading('Menghapus...');
      try {
        // Delete all penilaian (detail ikut ke-cascade)
        const { error: e1 } = await sb.from('penilaian').delete().gt('created_at', '1900-01-01');
        if (e1) throw e1;
        // Reset assignment status
        const { error: e2 } = await sb.from('assignment').update({ status: 'belum' }).gt('created_at', '1900-01-01');
        if (e2) throw e2;
        hideLoading();
        showToast('🗑️ Semua penilaian dihapus');
        // Refresh halaman Pengaturan tab Sistem (kalau sedang di sana)
        if (STATE.page === 'pengaturan' && PENGATURAN_TAB === 'sistem') {
          renderTabSistem();
        }
      } catch (e) {
        hideLoading();
        showToast('❌ ' + e.message);
      }
    },
    '🗑️', 'Hapus Semua', 'btn-danger'
  );
}

let DEFERRED_INSTALL_PROMPT = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      console.log('[PWA] SW registered:', reg.scope);
    }).catch((err) => {
      console.warn('[PWA] SW registration failed:', err);
    });
  });
}

// Tangkap event install prompt supaya kita bisa trigger manual
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
  // Tampilkan banner/tombol install jika belum di-install
  showInstallBanner();
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] App installed');
  DEFERRED_INSTALL_PROMPT = null;
  const banner = document.getElementById('installBanner');
  if (banner) banner.remove();
});

function showInstallBanner() {
  // Hindari dobel banner
  if (document.getElementById('installBanner')) return;
  // Jangan tampilkan di halaman login/setup
  if (!STATE.user) return;

  const banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.style.cssText = 'position:fixed;bottom:90px;left:16px;right:16px;max-width:460px;margin:0 auto;background:var(--primary-gradient);color:white;padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(37,99,235,0.3);z-index:250;display:flex;align-items:center;gap:10px';
  banner.innerHTML = `
    <span class="material-symbols-outlined" style="font-size:24px">download</span>
    <div style="flex:1;font-size:12px;line-height:1.3">
      <div style="font-weight:800">Install Aplikasi</div>
      <div style="opacity:.85">Akses lebih cepat dari homescreen</div>
    </div>
    <button onclick="triggerInstall()" style="background:white;color:var(--primary);border:none;padding:7px 14px;border-radius:8px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer">Install</button>
    <button onclick="dismissInstallBanner()" style="background:transparent;color:white;border:none;padding:4px;cursor:pointer;font-size:18px;line-height:1">✕</button>
  `;
  document.body.appendChild(banner);
}

window.triggerInstall = async function() {
  if (!DEFERRED_INSTALL_PROMPT) {
    showToast('ℹ️ Install via menu browser (titik 3) → "Tambah ke Layar Utama"');
    return;
  }
  DEFERRED_INSTALL_PROMPT.prompt();
  const { outcome } = await DEFERRED_INSTALL_PROMPT.userChoice;
  if (outcome === 'accepted') {
    showToast('✅ Aplikasi diinstal');
  }
  DEFERRED_INSTALL_PROMPT = null;
  dismissInstallBanner();
};

window.dismissInstallBanner = function() {
  const banner = document.getElementById('installBanner');
  if (banner) banner.remove();
  // Ingat user sudah dismiss (jangan tampilkan lagi session ini)
  sessionStorage.setItem('installBannerDismissed', '1');
};

// ═════════════════════════════════════════════════════════════════
// MICRO-ANIMATION HELPERS
// ═════════════════════════════════════════════════════════════════

// Button ripple effect — trigger saat klik button
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn');
  if (!btn || btn.disabled) return;
  // Re-trigger animasi ripple
  btn.classList.remove('ripple');
  // Force reflow
  void btn.offsetWidth;
  btn.classList.add('ripple');
  setTimeout(() => btn.classList.remove('ripple'), 500);
});

// Number counter animation — untuk elemen dengan class "stat-number"
// Dipanggil otomatis saat elemen baru dimasukkan ke DOM (via MutationObserver)
function animateNumber(el, target, duration = 800) {
  const prefersReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduce) {
    el.textContent = Number.isInteger(target) ? target : target.toFixed(2);
    return;
  }
  const start = performance.now();
  const isInt = Number.isInteger(target);
  const startVal = 0;

  function step(now) {
    const elapsed = now - start;
    const progress = Math.min(1, elapsed / duration);
    // Easing: cubic-bezier-like ease-out
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = startVal + (target - startVal) * eased;
    el.textContent = isInt ? Math.round(current) : current.toFixed(2);
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = isInt ? target : target.toFixed(2);
    }
  }
  requestAnimationFrame(step);
}

// Trigger number animation untuk semua .stat-number yang baru dirender.
// Pakai IntersectionObserver supaya hanya animasi kalau visible.
const numberObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const el = entry.target;
      if (el.dataset.animated) return;
      const val = parseFloat(el.textContent);
      if (!isNaN(val) && val !== 0) {
        el.dataset.animated = '1';
        animateNumber(el, val, 700);
      } else {
        el.dataset.animated = '1';
      }
      numberObserver.unobserve(el);
    }
  });
}, { threshold: 0.3 });

// MutationObserver untuk auto-attach number animation pada elemen baru
const domObserver = new MutationObserver((mutations) => {
  mutations.forEach(m => {
    m.addedNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      // Cari .stat-number dalam node dan anak-anaknya
      const targets = node.classList?.contains('stat-number')
        ? [node]
        : node.querySelectorAll?.('.stat-number') || [];
      targets.forEach(el => {
        if (!el.dataset.animated) numberObserver.observe(el);
      });
    });
  });
});
domObserver.observe(document.body, { childList: true, subtree: true });

// Success shake untuk error feedback (dipakai di tempat strategis)
function shakeElement(el) {
  if (!el) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'shake 0.4s ease';
  setTimeout(() => { el.style.animation = ''; }, 400);
}

// ═════════════════════════════════════════════════════════════════
// RECALC PENILAIAN SAAT KATEGORI BERUBAH
// ═════════════════════════════════════════════════════════════════
async function recalcPenilaianForSiswa(siswaId, siswa) {
  const { data: list, error } = await sb.from('penilaian')
    .select('*, nilai_detail(*)')
    .eq('siswa_id', siswaId);
  if (error) throw error;
  if (!list || !list.length) return 0;

  for (const pen of list) {
    const details = (pen.nilai_detail || []).filter(d => d.surah_nama);
    if (!details.length) continue;

    const totals = details.map(b => hitungTotal(b));
    const kualitas = totals.reduce((a,b) => a+b, 0) / totals.length;

    const kat = getKategori(siswa);
    let juz, kuantitas;
    if (kat === 'TAHAP_IQRA') {
      const hasil = hitungKuantitasIqra(details);
      juz = hasil.count;
      kuantitas = Math.min(100, hasil.persen);
    } else if (kat === 'ALQURAN_PEMULA') {
      const hasil = hitungKuantitasPemula(details);
      juz = Number(hasil.totalJuz.toFixed(4));
      kuantitas = Math.min(100, hasil.totalJuz * 100);
    } else {
      const hasil = hitungJuzOtomatis(details);
      juz = Number(hasil.totalJuz.toFixed(4));
      kuantitas = hitungNilaiKuantitas(juz, siswa.kelas);
    }
    const akhir = hitungNilaiAkhir(kualitas, kuantitas);

    await sb.from('penilaian').update({
      jumlah_juz: juz,
      nilai_kuantitas: kuantitas,
      nilai_akhir: akhir,
      updated_at: new Date().toISOString()
    }).eq('id', pen.id);
  }
  return list.length;
}

// ═════════════════════════════════════════════════════════════════
// BULK SET KATEGORI
// ═════════════════════════════════════════════════════════════════
let _bulkMode = false;

function openBulkSetKategori() {
  const siswa = window._siswaCache || [];
  if (!siswa.length) { showToast('⚠️ Tidak ada data siswa'); return; }

  _bulkMode = true;
  const body = getTabBodyEl();
  const listEl = body.querySelector('#siswaList');
  if (!listEl) return;

  // Ganti tombol "Atur Kategori Massal" menjadi panel konfirmasi
  const bulkBtn = body.querySelector('[onclick="openBulkSetKategori()"]');
  if (bulkBtn) {
    bulkBtn.outerHTML = `
      <div id="bulkKategoriPanel" class="card" style="margin-bottom:10px;border:2px solid var(--primary)">
        <div class="card-title"><span class="material-symbols-outlined" style="font-size:15px">category</span> Atur Kategori Massal</div>
        <p class="text-small text-muted" style="margin-bottom:10px">Centang siswa yang ingin diubah kategorinya, lalu pilih kategori dan klik Terapkan.</p>
        <div class="form-group">
          <label>Pilih Kategori</label>
          <select id="bulkKatSelect">
            ${KATEGORI_LIST.map(k => `<option value="${k.value}">${k.icon} ${k.label}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" style="flex:1" onclick="cancelBulkSetKategori()">Batal</button>
          <button class="btn btn-primary btn-sm" style="flex:1" onclick="applyBulkSetKategori()">
            <span class="material-symbols-outlined" style="font-size:14px">check</span> Terapkan
          </button>
        </div>
        <div style="margin-top:8px;display:flex;gap:6px">
          <button class="btn btn-accent btn-sm" onclick="selectAllSiswa(true)">Pilih Semua</button>
          <button class="btn btn-outline btn-sm" onclick="selectAllSiswa(false)">Batal Semua</button>
        </div>
      </div>
    `;
  }
  // Re-render list dengan checkbox
  listEl.innerHTML = renderSiswaListHtml(siswa, true);
}

function cancelBulkSetKategori() {
  _bulkMode = false;
  renderAdminSiswa();
}

function toggleSiswaCheck(id) {
  const chk = document.getElementById('chk_' + id);
  if (chk) chk.checked = !chk.checked;
}

function selectAllSiswa(select) {
  document.querySelectorAll('.siswa-chk').forEach(c => { c.checked = select; });
}

async function applyBulkSetKategori() {
  const kategori = document.getElementById('bulkKatSelect')?.value;
  if (!kategori) return showToast('⚠️ Pilih kategori terlebih dahulu');

  const checked = [...document.querySelectorAll('.siswa-chk:checked')].map(c => c.value);
  if (!checked.length) return showToast('⚠️ Tidak ada siswa yang dipilih');

  const katLabel = getKategoriInfo(kategori).label;
  showConfirm(
    'Atur Kategori Massal',
    `Ubah kategori ${checked.length} siswa menjadi "${katLabel}"? Penilaian yang sudah ada akan dihitung ulang.`,
    async () => {
      showLoading(`Memproses ${checked.length} siswa...`);
      try {
        // Update kategori semua siswa terpilih
        const { error } = await sb.from('siswa')
          .update({ kategori })
          .in('id', checked);
        if (error) throw error;

        // Recalc penilaian untuk setiap siswa
        const allSiswa = window._siswaCache || [];
        let recalcCount = 0;
        for (const siswaId of checked) {
          const siswa = allSiswa.find(s => s.id === siswaId);
          const siswaWithKat = { ...siswa, kategori };
          recalcCount += await recalcPenilaianForSiswa(siswaId, siswaWithKat);
        }

        hideLoading();
        _bulkMode = false;
        showToast(`✅ ${checked.length} siswa diperbarui · ${recalcCount} penilaian dihitung ulang`);
        renderAdminSiswa();
      } catch (e) {
        hideLoading();
        showToast('❌ ' + e.message);
      }
    },
    '🔄', 'Terapkan', 'btn-primary'
  );
}
